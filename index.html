<body class="bg-white dark:bg-[#0a0a0c] text-slate-900 dark:text-zinc-50 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Helper: Safe KaTeX formula renderer component
    function MathSpan({ text, className = '' }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(containerRef.current, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false
            });
          } catch (e) {
            console.error('KaTeX rendering error:', e);
          }
        }
      }, [text]);

      return <span ref={containerRef} className={className}>{text}</span>;
    }

    // Helper: Format seconds to HH:MM:SS
    function formatTime(seconds) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Helper: Rich KaTeX & Markdown formatted container
    function RichMathContent({ text, className = '' }) {
      const containerRef = useRef(null);

      const formattedHtml = useMemo(() => {
        if (!text) return '';
        return String(text)
          .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900 dark:text-zinc-100">$1</strong>')
          .replace(/\n\n/g, '<div class="h-2.5"></div>')
          .replace(/\n/g, '<br/>');
      }, [text]);

      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(containerRef.current, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false
            });
          } catch (e) {
            console.error('KaTeX rendering error:', e);
          }
        }
      }, [formattedHtml]);

      return (
        <div
          ref={containerRef}
          className={className}
          dangerouslySetInnerHTML={{ __html: formattedHtml }}
        />
      );
    }

    // Helper: Format duration into readable Xm Ys
    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return '0s';
      if (seconds < 60) return `${seconds}s`;
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
    }

    // COMPONENT: Estimated JEE Rank Predictor Card
    function RankPredictorCard({ prediction, candidateName }) {
      if (!prediction) return null;

      const isAdvanced = prediction.examType === 'JEE Advanced';
      const colorMap = {
        emerald: {
          bg: 'from-emerald-950/70 via-slate-900 to-slate-950',
          border: 'border-emerald-500/40',
          badge: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
          text: 'text-emerald-400',
          bar: 'bg-emerald-500'
        },
        indigo: {
          bg: 'from-indigo-950/70 via-slate-900 to-slate-950',
          border: 'border-indigo-500/40',
          badge: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30',
          text: 'text-indigo-400',
          bar: 'bg-indigo-500'
        },
        amber: {
          bg: 'from-amber-950/70 via-slate-900 to-slate-950',
          border: 'border-amber-500/40',
          badge: 'bg-amber-500/10 text-amber-400 border-amber-500/30',
          text: 'text-amber-400',
          bar: 'bg-amber-500'

          border: 'border-rose-500/40',
          badge: 'bg-rose-500/10 text-rose-400 border-rose-500/30',
          text: 'text-rose-400',
          bar: 'bg-rose-500'
        }

      const scheme = colorMap[prediction.statusColor] || colorMap.indigo;

      return (
        <div className={`rounded-3xl border ${scheme.border} bg-gradient-to-br ${scheme.bg} p-6 sm:p-8 text-white shadow-2xl shadow-black/40 relative overflow-hidden space-y-6`}>
          <div className="absolute -right-24 -top-24 w-72 h-72 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none" />

          {/* Top Header */}
          <div className="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/10 pb-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xl">🎯</span>
                <h3 className="text-lg sm:text-xl font-extrabold tracking-tight">

            </div>
            <span className={`px-3 py-1 rounded-full text-xs font-bold border self-start sm:self-auto ${scheme.badge}`}>
              {isAdvanced ? 'JEE Advanced Cutoff Model' : 'JEE Mains NTA Percentile Model'}
            </span>
          </div>

          {/* Rank Range & Tier Standings */}
          <div className="relative z-10 grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
            <div className="md:col-span-7 space-y-2.5">
              <p className="text-xs font-bold uppercase tracking-wider text-slate-400">
                Official Projection for {candidateName}
              </p>
              <div className="flex flex-wrap items-baseline gap-3">
                <span className="text-3xl sm:text-4xl lg:text-5xl font-black text-white tracking-tight">
                  {prediction.predictedAirDisplay}
                </span>
                {prediction.estimatedPercentile !== undefined && (
                  <span className="px-3 py-1 rounded-xl bg-indigo-500/20 text-indigo-300 font-mono text-sm font-extrabold border border-indigo-500/30">
                    {prediction.estimatedPercentile}%ile

                )}
              </div>
              <div className="flex items-center gap-2 pt-1">
                <span className="text-xs text-slate-400">Projected Tier:</span>
                <span className={`text-xs sm:text-sm font-extrabold px-2.5 py-0.5 rounded-lg bg-white/10 ${scheme.text}`}>
                  {prediction.tierLabel}
                </span>
              </div>
            </div>

            <div className="md:col-span-5 p-4 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm space-y-2 text-xs">
              <div className="flex justify-between text-slate-300">
                <span>Score Percentage:</span>

          {/* Visual Milestone Progress Tracker */}

              <span className="text-slate-400 font-mono">Current: {prediction.percentage}%</span>
            </div>

            <div className="relative py-4">
              <div className="absolute top-1/2 left-0 right-0 -translate-y-1/2 h-2.5 bg-slate-800 rounded-full overflow-hidden">
                <div
                  className={`h-full transition-all duration-700 ${scheme.bar}`}
                  style={{ width: `${Math.min(100, Math.max(0, (prediction.percentage / (isAdvanced ? 85 : 90)) * 100))}%` }}
                />
              </div>

              <div className="relative flex justify-between">
                {prediction.milestones.map((m, idx) => {
                  const isAchieved = m.achieved;
                  return (

                          isAchieved
                            ? 'bg-emerald-500 border-white text-slate-950 shadow-md shadow-emerald-500/50'
                            : 'bg-slate-900 border-slate-700 text-slate-400'
                        }`}
                      >
                        {isAchieved ? '✓' : idx + 1}
                      </div>
                      <span className={`text-[10px] sm:text-xs mt-1.5 font-bold leading-tight ${isAchieved ? 'text-white' : 'text-slate-500'}`}>

          {/* Next-Milestone Strategic Insight */}

          ) : (

              <div className="space-y-0.5">
                <p className="font-extrabold text-emerald-300 uppercase tracking-wider text-[11px]">

          <p className="relative z-10 text-[11px] text-slate-400/80 leading-relaxed italic border-t border-white/5 pt-3">
            * Disclaimer: Estimated rank ranges are projected using piecewise linear interpolation from official multi-year JEE cutoff distributions. Actual AIR depends on exam paper difficulty, candidate pool variance, and official normalization schemes.
          </p>
        </div>
      );
    }

    // COMPONENT: Subject-wise Score & Accuracy Chart (Grouped Bar Chart)
    function SubjectScoreAccuracyChart({ subjectStats }) {
      const [hovered, setHovered] = useState(null);
      const subjects = Object.entries(subjectStats || {});
      if (subjects.length === 0) return null;

      const maxVal = Math.max(...subjects.map(([_, d]) => Math.max(d.max || 60, d.scored || 0)), 60);

      return (
        <div className="rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#12131a] p-6 shadow-sm space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 dark:border-zinc-800 pb-3">
            <div>
              <h4 className="text-sm font-extrabold text-slate-900 dark:text-zinc-50 flex items-center gap-1.5">
                <span>📊</span> Subject-wise Score & Accuracy
              </h4>
              <p className="text-[11px] text-slate-500 dark:text-zinc-400">
                Compare Scored Marks vs. Maximum Marks & Accuracy %
              </p>
            </div>
            <div className="flex items-center gap-3 text-xs">
              <span className="flex items-center gap-1.5 text-slate-500 dark:text-zinc-400">
                <span className="w-3 h-3 rounded-sm bg-slate-200 dark:bg-zinc-700 inline-block" /> Max Marks
              </span>
              <span className="flex items-center gap-1.5 text-indigo-600 dark:text-indigo-400 font-semibold">
                <span className="w-3 h-3 rounded-sm bg-indigo-600 inline-block" /> Scored Marks
              </span>
            </div>
          </div>

          <div className="w-full overflow-x-auto">
            <svg viewBox="0 0 450 190" className="w-full h-auto min-w-[320px]">
              <defs>
                <linearGradient id="scoredGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#6366f1" />
                  <stop offset="100%" stopColor="#4338ca" />
                </linearGradient>
                <linearGradient id="hoverGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#818cf8" />
                  <stop offset="100%" stopColor="#4f46e5" />
                </linearGradient>
              </defs>

              {[0, 0.25, 0.5, 0.75, 1].map((pct, i) => {
                const y = 140 - pct * 110;
                const val = Math.round(pct * maxVal);
                return (
                  <g key={i}>
                    <line x1="45" y1={y} x2="430" y2={y} stroke="currentColor" className="text-slate-100 dark:text-zinc-800" strokeDasharray="3 3" />
                    <text x="38" y={y + 3} textAnchor="end" className="text-[10px] fill-slate-400 dark:fill-zinc-500 font-mono">
                      {val}
                    </text>
                  </g>
                );
              })}

              {subjects.map(([subj, data], idx) => {
                const groupX = 60 + idx * 125;
                const maxH = Math.max(4, (data.max / maxVal) * 110);
                const scoredH = Math.max(0, (Math.max(0, data.scored) / maxVal) * 110);
                const maxBarY = 140 - maxH;
                const scoredBarY = 140 - scoredH;
                const acc = data.attempted > 0 ? Math.round(((data.correct + data.partial) / data.attempted) * 100) : 0;
                const isHov = hovered === subj;

                return (
                  <g
                    key={subj}
                    className="cursor-pointer transition-all"
                    onMouseEnter={() => setHovered(subj)}
                    onMouseLeave={() => setHovered(null)}
                  >
                    <rect
                      x={groupX}
                      y={maxBarY}
                      width="38"
                      height={maxH}
                      rx="6"
                      className="fill-slate-100 dark:fill-zinc-800 transition-colors"
                    />
                    <text
                      x={groupX + 19}
                      y={maxBarY - 5}
                      textAnchor="middle"
                      className="text-[10px] font-mono fill-slate-400 dark:fill-zinc-500"
                    >
                      {data.max}M
                    </text>

                    <rect
                      x={groupX + 44}
                      y={scoredBarY}
                      width="38"
                      height={scoredH}
                      rx="6"
                      fill={isHov ? 'url(#hoverGrad)' : 'url(#scoredGrad)'}
                      className="transition-all"
                    />
                    <text
                      x={groupX + 63}
                      y={scoredBarY - 5}
                      textAnchor="middle"
                      className="text-[10px] font-mono font-bold fill-indigo-600 dark:fill-indigo-400"
                    >
                      {data.scored}M
                    </text>

                    <text
                      x={groupX + 41}
                      y="160"
                      textAnchor="middle"
                      className="text-[11px] font-bold fill-slate-800 dark:fill-zinc-200"
                    >
                      {subj === 'Mathematics' ? 'Maths' : subj}
                    </text>

                    <rect
                      x={groupX + 15}
                      y="168"
                      width="52"
                      height="16"
                      rx="8"
                      className={acc >= 75 ? 'fill-emerald-100 dark:fill-emerald-950' : acc >= 50 ? 'fill-indigo-100 dark:fill-indigo-950' : 'fill-amber-100 dark:fill-amber-950'}
                    />
                    <text
                      x={groupX + 41}
                      y="180"
                      textAnchor="middle"
                      className={`text-[9px] font-extrabold ${acc >= 75 ? 'fill-emerald-700 dark:fill-emerald-400' : acc >= 50 ? 'fill-indigo-700 dark:fill-indigo-400' : 'fill-amber-700 dark:fill-amber-400'}`}
                    >
                      {acc}% Acc
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>

          <div className="pt-2 border-t border-slate-100 dark:border-zinc-800/80 text-xs flex flex-wrap items-center justify-between gap-2">
            {hovered ? (
              <div className="flex items-center gap-3 text-slate-700 dark:text-zinc-300">
                <span className="font-extrabold text-indigo-600 dark:text-indigo-400">{hovered}:</span>
                <span>Scored <strong className="font-bold">{subjectStats[hovered].scored}/{subjectStats[hovered].max}</strong></span>
                <span>·</span>
                <span>Correct: <strong className="text-emerald-600">{subjectStats[hovered].correct}</strong></span>
                <span>·</span>
                <span>Partial: <strong className="text-amber-600">{subjectStats[hovered].partial}</strong></span>
                <span>·</span>
                <span>Incorrect: <strong className="text-rose-600">{subjectStats[hovered].incorrect}</strong></span>
              </div>
            ) : (
              <span className="text-[11px] text-slate-400 dark:text-zinc-500 italic">
                Hover over any subject bar to view exact question accuracy breakdown.
              </span>
            )}
          </div>
        </div>
      );
    }

    // COMPONENT: Attempt Breakdown Donut Chart
    function AttemptBreakdownDonutChart({ correct, partial, incorrect, unattempted, accuracy, attemptedCount, totalQuestions }) {
      const [hoveredIdx, setHoveredIdx] = useState(null);

      const total = totalQuestions || (correct + partial + incorrect + unattempted) || 1;
      const segments = [
        { label: 'Fully Correct', count: correct, color: '#10b981', hoverColor: '#34d399', textClass: 'text-emerald-600' },
        { label: 'Partially Correct', count: partial, color: '#f59e0b', hoverColor: '#fbbf24', textClass: 'text-amber-600' },
        { label: 'Incorrect', count: incorrect, color: '#ef4444', hoverColor: '#f87171', textClass: 'text-rose-600' },
        { label: 'Unattempted', count: unattempted, color: '#94a3b8', hoverColor: '#cbd5e1', textClass: 'text-slate-500' }
      ].filter(s => s.count > 0);

      const radius = 68;
      const strokeWidth = 26;
      const cx = 100;
      const cy = 100;
      const circumference = 2 * Math.PI * radius;

      let currentOffset = 0;
      const arcs = segments.map((seg, i) => {
        const fraction = seg.count / total;
        const strokeDasharray = `${fraction * circumference} ${circumference}`;
        const strokeDashoffset = -currentOffset;
        currentOffset += fraction * circumference;
        const pct = Math.round((seg.count / total) * 100);
        return { ...seg, strokeDasharray, strokeDashoffset, pct, index: i };
      });

      return (
        <div className="rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#12131a] p-6 shadow-sm space-y-4">
          <div className="border-b border-slate-100 dark:border-zinc-800 pb-3">
            <h4 className="text-sm font-extrabold text-slate-900 dark:text-zinc-50 flex items-center gap-1.5">
              <span>🎯</span> Attempt & Accuracy Breakdown
            </h4>
            <p className="text-[11px] text-slate-500 dark:text-zinc-400">
              Distribution of answered, partial, incorrect & skipped questions
            </p>
          </div>

          <div className="flex flex-col sm:flex-row items-center justify-center gap-6 py-2">
            <div className="relative w-44 h-44 flex-shrink-0">
              <svg viewBox="0 0 200 200" className="w-full h-full transform -rotate-90">
                <circle cx={cx} cy={cy} r={radius} fill="none" stroke="currentColor" className="text-slate-100 dark:text-zinc-800/80" strokeWidth={strokeWidth} />
                {arcs.map((arc) => {
                  const isHov = hoveredIdx === arc.index;
                  return (
                    <circle
                      key={arc.label}
                      cx={cx}
                      cy={cy}
                      r={radius}
                      fill="none"
                      stroke={isHov ? arc.hoverColor : arc.color}
                      strokeWidth={isHov ? strokeWidth + 4 : strokeWidth}
                      strokeDasharray={arc.strokeDasharray}
                      strokeDashoffset={arc.strokeDashoffset}
                      className="cursor-pointer transition-all duration-200"
                      onMouseEnter={() => setHoveredIdx(arc.index)}
                      onMouseLeave={() => setHoveredIdx(null)}
                    />
                  );
                })}
              </svg>

              <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                {hoveredIdx !== null && arcs[hoveredIdx] ? (

    // Adaptive Scoring Engine: supports JEE Mains (+4 / -1) and JEE Advanced (multi-correct partials) with Time & Format Analytics
    function evaluatePaper(testPaper, responses, questionTimes = {}) {
      const isJeeMains = testPaper.examType === 'JEE Mains' || testPaper.examCategory === 'jee-mains';
      let totalMarksScored = 0;
      let totalMaxMarks = testPaper.maxMarks || (isJeeMains ? 300 : 180);
      let attemptedCount = 0;
      let correctCount = 0;
      let partialCount = 0;
      let incorrectCount = 0;
      let unattemptedCount = 0;

      const subjectStats = {
        Mathematics: { scored: 0, max: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, timeSpent: 0 },
        Physics: { scored: 0, max: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, timeSpent: 0 },
        Chemistry: { scored: 0, max: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, timeSpent: 0 },
      };

      const questionTypeStats = {
        single_correct: { label: 'Single Correct MCQ', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        multiple_correct: { label: 'Multiple Correct MCQ', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        numerical: { label: 'Numerical Value', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        integer: { label: 'Integer Value', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        matching_list: { label: 'Match-the-List', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        comprehension: { label: 'Comprehension / Paragraph', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
      };

      let totalTimeSpent = 0;
      let correctTime = 0, correctTimeCount = 0;
      let incorrectTime = 0, incorrectTimeCount = 0;
      let unattemptedTime = 0, unattemptedTimeCount = 0;

      const questionBreakdown = testPaper.questions.map((q) => {
        const studentResp = responses[q.id];
        const marking = q.marking || {};
        const pos = marking.positive !== undefined ? marking.positive : (isJeeMains ? 4 : (q.type === 'multiple_correct' ? 4 : 3));
        const neg = marking.negative !== undefined ? marking.negative : (isJeeMains ? 1 : (q.type === 'multiple_correct' ? 2 : 1));
        const correctAns = q.answer;
        const qTime = questionTimes[q.id] || 0;
        totalTimeSpent += qTime;

        const subj = q.subject || 'Mathematics';
        if (!subjectStats[subj]) {
          subjectStats[subj] = { scored: 0, max: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, timeSpent: 0 };
        }
        subjectStats[subj].max += pos;
        subjectStats[subj].timeSpent = (subjectStats[subj].timeSpent || 0) + qTime;

        const typeKey = q.type || 'single_correct';
        if (!questionTypeStats[typeKey]) {
          questionTypeStats[typeKey] = { label: typeKey, total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 };
        }
        questionTypeStats[typeKey].total++;
        questionTypeStats[typeKey].max += pos;

        // Check if unattempted
        const isUnattempted = studentResp === undefined || studentResp === null ||
          (typeof studentResp === 'string' && studentResp.trim() === '') ||
          (Array.isArray(studentResp) && studentResp.length === 0);

        if (isUnattempted) {
          unattemptedCount++;
          unattemptedTime += qTime;
          unattemptedTimeCount++;
          return {
            question: q,
            studentResp: null,
            correctAns,
            marksAwarded: 0,
            status: 'unattempted',
            statusLabel: 'Unattempted',
            timeSpent: qTime
          };
        }

        attemptedCount++;
        subjectStats[subj].attempted++;
        questionTypeStats[typeKey].attempted++;

        // 1. Single Correct & Matching List
        if (q.type === 'single_correct' || q.type === 'matching_list') {
          const isCorrect = String(studentResp).trim().toUpperCase() === String(correctAns).trim().toUpperCase();
          const marks = isCorrect ? pos : -neg;
          totalMarksScored += marks;
          subjectStats[subj].scored += marks;
          questionTypeStats[typeKey].scored += marks;

          if (isCorrect) {
            correctCount++;
            correctTime += qTime;
            correctTimeCount++;
            subjectStats[subj].correct++;
            questionTypeStats[typeKey].correct++;
          } else {
            incorrectCount++;
            incorrectTime += qTime;
            incorrectTimeCount++;
            subjectStats[subj].incorrect++;
            questionTypeStats[typeKey].incorrect++;
          }

          return {
            question: q,
            studentResp,
            correctAns,
            marksAwarded: marks,
            status: isCorrect ? 'correct' : 'incorrect',
            statusLabel: isCorrect ? `Full Marks (+${pos})` : `Incorrect (-${neg})`,
            timeSpent: qTime
          };
        }

        // 2. Numerical / Integer
        if (q.type === 'numerical' || q.type === 'integer') {
          const sVal = parseFloat(String(studentResp).trim());
          const cVal = parseFloat(String(correctAns).trim());
          const isCorrect = !isNaN(sVal) && !isNaN(cVal) && Math.abs(sVal - cVal) < 0.05;
          const marks = isCorrect ? pos : -neg;
          totalMarksScored += marks;
          subjectStats[subj].scored += marks;
          questionTypeStats[typeKey].scored += marks;

          if (isCorrect) {
            correctCount++;
            correctTime += qTime;
            correctTimeCount++;
            subjectStats[subj].correct++;
            questionTypeStats[typeKey].correct++;
          } else {
            incorrectCount++;
            incorrectTime += qTime;
            incorrectTimeCount++;
            subjectStats[subj].incorrect++;
            questionTypeStats[typeKey].incorrect++;
          }

          return {
            question: q,
            studentResp,
            correctAns,
            marksAwarded: marks,
            status: isCorrect ? 'correct' : 'incorrect',
            statusLabel: isCorrect ? `Correct (+${pos})` : `Incorrect (-${neg})`,
            timeSpent: qTime
          };
        }

        // 3. Multiple Correct Option (JEE Advanced Official Partial Marking)
        if (q.type === 'multiple_correct') {
          const correctArr = Array.isArray(correctAns) ? correctAns : [correctAns];
          const studentArr = Array.isArray(studentResp) ? studentResp : [studentResp];

          const correctSet = new Set(correctArr.map(s => String(s).trim().toUpperCase()));
          const studentSet = new Set(studentArr.map(s => String(s).trim().toUpperCase()));

          let hasWrong = false;
          for (const opt of studentSet) {
            if (!correctSet.has(opt)) {
              hasWrong = true;
              break;
            }
          }

          if (hasWrong) {
            const marks = -neg;
            totalMarksScored += marks;
            subjectStats[subj].scored += marks;
            questionTypeStats[typeKey].scored += marks;
            incorrectCount++;
            incorrectTime += qTime;
            incorrectTimeCount++;
            subjectStats[subj].incorrect++;
            questionTypeStats[typeKey].incorrect++;
            return {
              question: q,
              studentResp: Array.from(studentSet).sort(),
              correctAns: Array.from(correctSet).sort(),
              marksAwarded: marks,
              status: 'incorrect',
              statusLabel: `Incorrect (-${neg})`,
              timeSpent: qTime
            };
          }

          // All correct selected!
          if (studentSet.size === correctSet.size) {
            totalMarksScored += pos;
            subjectStats[subj].scored += pos;
            questionTypeStats[typeKey].scored += pos;
            correctCount++;
            correctTime += qTime;
            correctTimeCount++;
            subjectStats[subj].correct++;
            questionTypeStats[typeKey].correct++;
            return {
              question: q,
              studentResp: Array.from(studentSet).sort(),
              correctAns: Array.from(correctSet).sort(),
              marksAwarded: pos,
              status: 'correct',
              statusLabel: `Full Marks (+${pos})`,
              timeSpent: qTime
            };
          }

          // Partial Marking
          let partialMarks = 1;
          if (correctSet.size === 4 && studentSet.size === 3) {
            partialMarks = 3;
          } else if (correctSet.size >= 3 && studentSet.size === 2) {
            partialMarks = 2;
          } else if (correctSet.size >= 2 && studentSet.size === 1) {
            partialMarks = 1;
          } else {
            partialMarks = Math.min(studentSet.size, pos);
          }

          totalMarksScored += partialMarks;
          subjectStats[subj].scored += partialMarks;
          questionTypeStats[typeKey].scored += partialMarks;
          partialCount++;
          correctTime += qTime;
          correctTimeCount++;
          subjectStats[subj].partial++;
          questionTypeStats[typeKey].partial++;

          return {
            question: q,
            studentResp: Array.from(studentSet).sort(),
            correctAns: Array.from(correctSet).sort(),
            marksAwarded: partialMarks,
            status: 'partial',
            statusLabel: `Partial Marks (+${partialMarks})`,
            timeSpent: qTime
          };
        }

        return {
          question: q,
          studentResp,
          correctAns,
          marksAwarded: 0,
          status: 'unattempted',
          statusLabel: 'Unattempted',
          timeSpent: qTime
        };
      });

      const accuracy = attemptedCount > 0 ? Math.round(((correctCount + partialCount) / attemptedCount) * 100) : 0;
      const percentage = Math.round((totalMarksScored / totalMaxMarks) * 100);

      // Finalize question type accuracy
      Object.values(questionTypeStats).forEach(item => {
        item.accuracy = item.attempted > 0 ? Math.round(((item.correct + item.partial) / item.attempted) * 100) : 0;
      });

      const avgCorrectTime = correctTimeCount > 0 ? Math.round(correctTime / correctTimeCount) : 0;
      const avgIncorrectTime = incorrectTimeCount > 0 ? Math.round(incorrectTime / incorrectTimeCount) : 0;
      const avgUnattemptedTime = unattemptedTimeCount > 0 ? Math.round(unattemptedTime / unattemptedTimeCount) : 0;
      const isTimeTrap = avgIncorrectTime > avgCorrectTime && avgIncorrectTime > 40;

      const timeAnalysis = {
        totalTimeSpent,
        avgCorrectTime,
        avgIncorrectTime,
        avgUnattemptedTime,
        isTimeTrap
      };

      // Calculate Rank Prediction
      let rankPrediction = null;
      if (isJeeMains && typeof window.predictJeeMainsRank === 'function') {
        rankPrediction = window.predictJeeMainsRank(totalMarksScored, totalMaxMarks);
      } else if (typeof window.predictJeeAdvancedRank === 'function') {
        rankPrediction = window.predictJeeAdvancedRank(totalMarksScored, totalMaxMarks);
      }

      return {
        totalMarksScored,
        totalMaxMarks,
        attemptedCount,
        correctCount,
        partialCount,
        incorrectCount,
        unattemptedCount,
        accuracy,
        percentage,
        subjectStats,
        questionTypeStats,
        timeAnalysis,
        rankPrediction,
        questionBreakdown
      };
    }

          const el = document.getElementById('tests');
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        } else if (hash.includes('pta-04') || hash.includes('pta04')) {
          handleSelectTest('jee-advanced-pta-04');
        } else if (hash.includes('pta-05') || hash.includes('pta05')) {
          handleSelectTest('jee-advanced-pta-05');
        }
      };

      useEffect(() => {
        handleHashRoute();
        window.addEventListener('hashchange', handleHashRoute);
        return () => window.removeEventListener('hashchange', handleHashRoute);
      }, []);

      // Refs for timer-based per-question time tracking
      const currentQIndexRef = useRef(currentQIndex);
      useEffect(() => { currentQIndexRef.current = currentQIndex; }, [currentQIndex]);
      const currentQuestionsRef = useRef(currentQuestions);
      useEffect(() => { currentQuestionsRef.current = currentQuestions; }, [currentQuestions]);

      // Timer Effect in Exam Mode with Per-Question Time Accumulation
      useEffect(() => {
        if (view !== 'exam') return;

        const timer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              handleSubmitExam();
              return 0;
            }
            return prev - 1;
          });

          setQuestionTimes((prev) => {
            const qs = currentQuestionsRef.current;
            const idx = currentQIndexRef.current;
            const q = qs && qs[idx];
            if (!q) return prev;
            return { ...prev, [q.id]: (prev[q.id] || 0) + 1 };
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [view, currentPaper]);

      // Auto-save session
      useEffect(() => {
        if (view === 'exam' && currentPaper) {
          const sessionData = {
            candidateName,
            activeTestId,
            responses,
            statuses,
            currentQIndex,
            timeLeft
          };
          try {
            localStorage.setItem(`nelov_cbt_session_${activeTestId}`, JSON.stringify(sessionData));
          } catch (e) {}
        }
      }, [responses, statuses, currentQIndex, timeLeft, view, activeTestId]);

      // Switch question subject tabs automatically
      useEffect(() => {
        if (currentQuestion && currentQuestion.subject) {
          setActiveSubject(currentQuestion.subject);
        }
      }, [currentQIndex, currentQuestion]);

      // Start Test Flow
      const handleSelectTest = (testId) => {
        // Check if test is coming soon
        const all = window.allTests || [];
        const meta = all.find(t => t.id === testId);
        if (meta && meta.status === 'coming_soon') {
          setNoticeModal({
            title: `${meta.title} — Coming Soon`,
            message: `This paper is currently being digitized and verified with step-by-step KaTeX solutions. In the meantime, please attempt the live papers JEE Advanced PTA 04 and PTA 05!`,
            activeCategory: meta.examCategory
          });
          return;
        }

        setActiveTestId(testId);
        // Set hash
        if (testId.includes('pta-04')) {
          window.location.hash = '#/test/jee-advanced/pta-04';
        } else if (testId.includes('pta-05')) {
          window.location.hash = '#/test/jee-advanced/pta-05';
        }

        // Check for saved session
        const saved = localStorage.getItem(`nelov_cbt_session_${testId}`);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.responses) {
              setResponses(parsed.responses);
              setStatuses(parsed.statuses || {});
              setCurrentQIndex(parsed.currentQIndex || 0);
              setTimeLeft(parsed.timeLeft || 180 * 60);
              setCandidateName(parsed.candidateName || 'Guest Aspirant');
            }
          } catch (e) {}
        } else {
          setResponses({});
          setStatuses({});
          setQuestionTimes({});
          setReviewSubjectFilter('all');
          setReviewStatusFilter('all');
          setCurrentQIndex(0);
          setTimeLeft(180 * 60);
        }
        setView('instructions');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleBeginExam = () => {
        if (!agreeTerms) {
          alert('Please check the declaration box to proceed.');
          return;
        }
        setStatuses((prev) => {
          const next = { ...prev };
          if (!next[1]) next[1] = 'not_answered';
          return next;
        });
        setView('exam');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Answering handlers
      const handleOptionSelect = (optId) => {
        if (!currentQuestion) return;
        const qId = currentQuestion.id;

        if (currentQuestion.type === 'single_correct' || currentQuestion.type === 'matching_list') {
          setResponses((prev) => ({ ...prev, [qId]: optId }));
        } else if (currentQuestion.type === 'multiple_correct') {
          setResponses((prev) => {
            const currentList = Array.isArray(prev[qId]) ? [...prev[qId]] : [];
            const idx = currentList.indexOf(optId);
            if (idx > -1) {
              currentList.splice(idx, 1);
            } else {
              currentList.push(optId);
            }
            return { ...prev, [qId]: currentList.sort() };
          });
        }
      };

      const handleNumericalInput = (val) => {
        if (!currentQuestion) return;
        const qId = currentQuestion.id;
        setResponses((prev) => ({ ...prev, [qId]: val }));
      };

      const handleKeypadPress = (char) => {
        if (!currentQuestion) return;
        const qId = currentQuestion.id;
        const currentVal = String(responses[qId] || '');
        if (char === 'clear') {
          setResponses((prev) => ({ ...prev, [qId]: '' }));
        } else if (char === 'backspace') {
          setResponses((prev) => ({ ...prev, [qId]: currentVal.slice(0, -1) }));
        } else {
          if (char === '.' && currentVal.includes('.')) return;
          if (char === '-' && currentVal.length > 0) return;
          setResponses((prev) => ({ ...prev, [qId]: currentVal + char }));
        }
      };

      // Palette Actions
      const handleSaveAndNext = () => {
        if (!currentQuestion) return;
        const qId = currentQuestion.id;
        const resp = responses[qId];
        const hasAnswer = resp !== undefined && resp !== null &&
          ((typeof resp === 'string' && resp.trim() !== '') || (Array.isArray(resp) && resp.length > 0));

        setStatuses((prev) => ({
          ...prev,
          [qId]: hasAnswer ? 'answered' : 'not_answered'
        }));

        if (currentQIndex < currentQuestions.length - 1) {
          const nextIdx = currentQIndex + 1;
          setCurrentQIndex(nextIdx);
          const nextQ = currentQuestions[nextIdx];
          setStatuses((prev) => {
            if (!prev[nextQ.id]) {
              return { ...prev, [nextQ.id]: 'not_answered' };
            }
            return prev;
          });
        }
      };

      const handleMarkForReviewAndNext = () => {
        if (!currentQuestion) return;
        const qId = currentQuestion.id;
        const resp = responses[qId];
        const hasAnswer = resp !== undefined && resp !== null &&
          ((typeof resp === 'string' && resp.trim() !== '') || (Array.isArray(resp) && resp.length > 0));

        setStatuses((prev) => ({
          ...prev,
          [qId]: hasAnswer ? 'marked_answered' : 'marked'
        }));

        if (currentQIndex < currentQuestions.length - 1) {
          const nextIdx = currentQIndex + 1;
          setCurrentQIndex(nextIdx);
          const nextQ = currentQuestions[nextIdx];
          setStatuses((prev) => {
            if (!prev[nextQ.id]) {
              return { ...prev, [nextQ.id]: 'not_answered' };
            }
            return prev;
          });
        }
      };

      const handleClearResponse = () => {
        if (!currentQuestion) return;
        const qId = currentQuestion.id;
        setResponses((prev) => {
          const next = { ...prev };
          delete next[qId];
          return next;
        });
        setStatuses((prev) => ({
          ...prev,
          [qId]: 'not_answered'
        }));
      };

      const handleJumpToQuestion = (targetIdx) => {
        const targetQ = currentQuestions[targetIdx];
        if (!targetQ) return;
        setCurrentQIndex(targetIdx);
        setStatuses((prev) => {
          if (!prev[targetQ.id]) {
            return { ...prev, [targetQ.id]: 'not_answered' };
          }
          return prev;
        });
        setMobilePaletteOpen(false);
      };

      const handleSubmitExam = () => {
        if (!currentPaper) return;
        const evalResults = evaluatePaper(currentPaper, responses, questionTimes);
        setEvaluationData(evalResults);
        setShowSubmitModal(false);
        setView('result');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        try {
          localStorage.removeItem(`nelov_cbt_session_${activeTestId}`);
        } catch (e) {}
      };

      // Palette Count Calculations
      const paletteCounts = useMemo(() => {
        let answered = 0;
        let notAnswered = 0;
        let notVisited = 0;
        let marked = 0;
        let markedAnswered = 0;

        currentQuestions.forEach((q) => {
          const s = statuses[q.id];
          if (s === 'answered') answered++;
          else if (s === 'marked_answered') markedAnswered++;
          else if (s === 'marked') marked++;
          else if (s === 'not_answered') notAnswered++;
          else notVisited++;
        });

        return { answered, notAnswered, notVisited, marked, markedAnswered };
      }, [currentQuestions, statuses]);

      const subjectQuestions = useMemo(() => {
        return currentQuestions.filter((q) => q.subject === activeSubject);
      }, [currentQuestions, activeSubject]);

      const getButtonStatusClass = (qId) => {
        const s = statuses[qId];
        const isActive = currentQuestion && currentQuestion.id === qId;
        const activeRing = isActive ? 'ring-2 ring-indigo-600 ring-offset-2 dark:ring-offset-black scale-105 z-10 font-black' : '';

        if (s === 'answered') {
          return `bg-emerald-600 hover:bg-emerald-700 text-white ${activeRing}`;
        }
        if (s === 'not_answered') {
          return `bg-rose-500 hover:bg-rose-600 text-white ${activeRing}`;
        }
        if (s === 'marked') {
          return `bg-purple-600 hover:bg-purple-700 text-white rounded-full ${activeRing}`;
        }
        if (s === 'marked_answered') {
          return `bg-purple-700 hover:bg-purple-800 text-white relative rounded-full ${activeRing}`;
        }
        return `bg-slate-200 hover:bg-slate-300 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-slate-700 dark:text-zinc-300 ${activeRing}`;
      };

      // -------------------------------------------------------------
      // RENDER: EXAM VIEW
      // -------------------------------------------------------------
      if (view === 'exam') {
        const q = currentQuestion;
        const qId = q ? q.id : 0;
        const currentAns = q ? responses[qId] : null;

        return (
          <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-[#0c0d12] text-slate-900 dark:text-zinc-100 select-none">
            {/* Top Examination Hall Banner */}
            <header className="bg-white dark:bg-[#12131a] border-b border-slate-200 dark:border-zinc-800 px-4 py-2.5 sticky top-0 z-40 shadow-sm">
              <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
                
                {/* Title and Candidate Profile */}
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-indigo-600 text-white font-extrabold text-xs flex items-center justify-center shadow-md">
                    CBT
                  </div>
                  <div>
                    <h1 className="text-xs sm:text-sm font-extrabold text-slate-900 dark:text-white line-clamp-1">
                      {currentPaper ? currentPaper.title : 'JEE CBT Examination'}
                    </h1>
                    <p className="text-[11px] text-slate-500 dark:text-zinc-400 font-medium">
                      Candidate: <span className="font-bold text-indigo-600 dark:text-indigo-400">{candidateName}</span> · Nelov Mallick (IIT Delhi) Platform
                    </p>
                  </div>
                </div>

                {/* Countdown Timer & Actions */}
                <div className="flex items-center gap-3 sm:gap-4">
                  <div className={`flex items-center gap-2 px-3.5 py-1.5 rounded-xl border font-mono font-bold text-sm sm:text-base shadow-sm ${
                    timeLeft < 900
                      ? 'bg-rose-50 dark:bg-rose-950/60 border-rose-300 dark:border-rose-800 text-rose-600 dark:text-rose-400 animate-pulse'
                      : timeLeft < 1800
                      ? 'bg-amber-50 dark:bg-amber-950/60 border-amber-300 dark:border-amber-800 text-amber-700 dark:text-amber-400'
                      : 'bg-indigo-50 dark:bg-indigo-950/60 border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300'
                  }`}>
                    <svg className="w-4 h-4 text-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>{formatTime(timeLeft)}</span>
                  </div>

                  <button
                    onClick={() => setShowSubmitModal(true)}
                    className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-emerald-600/30 transition-all hover:scale-105 active:scale-95"
                  >
                    Submit Test
                  </button>

                  <button
                    onClick={() => setMobilePaletteOpen(!mobilePaletteOpen)}
                    className="lg:hidden p-2 rounded-xl border border-slate-200 dark:border-zinc-700 text-slate-700 dark:text-zinc-200"
                    title="Toggle Question Palette"
                  >
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                  </button>
                </div>

              </div>

              {/* Subject Tabs Navigation */}
              <div className="max-w-7xl mx-auto pt-2.5 flex items-center gap-2 overflow-x-auto border-t border-slate-100 dark:border-zinc-800/80 mt-2">
                {['Mathematics', 'Physics', 'Chemistry'].map((subj) => {
                  const subjQs = currentQuestions.filter((item) => item.subject === subj);
                  const answeredInSubj = subjQs.filter((item) => statuses[item.id] === 'answered' || statuses[item.id] === 'marked_answered').length;
                  const isActive = activeSubject === subj;

                  return (
                    <button
                      key={subj}
                      onClick={() => {
                        setActiveSubject(subj);
                        const firstQOfSubj = currentQuestions.findIndex((item) => item.subject === subj);
                        if (firstQOfSubj !== -1) {
                          handleJumpToQuestion(firstQOfSubj);
                        }
                      }}
                      className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-2 flex-shrink-0 ${
                        isActive
                          ? 'bg-indigo-600 text-white shadow-md'
                          : 'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-100'
                      }`}
                    >
                      <span>{subj}</span>
                      <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ${
                        isActive ? 'bg-white/20 text-white' : 'bg-slate-200 dark:bg-zinc-700 text-slate-700 dark:text-zinc-300'
                      }`}>
                        {answeredInSubj}/{subjQs.length}
                      </span>
                    </button>
                  );
                })}
              </div>
            </header>

            {/* Main Exam Area: 2 Columns on Desktop */}
            <div className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* Left Column: Active Question Canvas */}
              <div className="lg:col-span-8 flex flex-col justify-between rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#12131a] shadow-sm p-6 sm:p-8 min-h-[580px]">
                {q ? (
                  <div className="space-y-6">
                    {/* Question Header */}
                    <div className="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-100 dark:border-zinc-800">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
                            {q.subject}
                          </span>
                          <span className="text-slate-300 dark:text-zinc-700">·</span>
                          <span className="text-xs font-medium text-slate-500 dark:text-zinc-400">
                            {q.section}
                          </span>
                        </div>
                        <h2 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-zinc-50 pt-0.5">
                          Question {currentQIndex + 1} of {currentQuestions.length}
                        </h2>
                      </div>

                      {/* Marking Scheme Pill */}
                      <div className="flex items-center gap-2">
                        <span className="px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800">
                          +{q.marking?.positive || 3} Marks
                        </span>
                        {q.marking?.negative > 0 && (
                          <span className="px-2.5 py-1 rounded-full text-xs font-extrabold bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800">
                            -{q.marking.negative}
                          </span>
                        )}
                        {q.type === 'multiple_correct' && (
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-purple-50 dark:bg-purple-950/60 text-purple-600 dark:text-purple-400 border border-purple-200 dark:border-purple-800">
                            Partial Marking
                          </span>
                        )}
                      </div>
                    </div>

                    {/* Section Instructions if any */}
                    {q.sectionInstruction && (
                      <div className="p-3 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 text-xs text-slate-600 dark:text-zinc-400">
                        <span className="font-bold text-slate-800 dark:text-zinc-200">Instructions: </span>
                        <MathSpan text={q.sectionInstruction} />
                      </div>
                    )}

                    {/* Question Statement */}
                    <div className="text-sm sm:text-base text-slate-900 dark:text-zinc-100 leading-relaxed space-y-3 font-normal">
                      <MathSpan text={q.question} />
                    </div>

                    {/* Diagram / Graph Assets */}
                    {q.images && q.images.length > 0 && (
                      <div className="py-2 flex flex-wrap gap-4 items-center justify-center">
                        {q.images.map((imgSrc, idx) => (
                          <div key={idx} className="p-3 bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm max-w-full">
                            <img
                              src={imgSrc}
                              alt={`Question Diagram ${idx + 1}`}
                              className="max-h-64 object-contain rounded-lg mx-auto"
                            />
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Matching List Table Display */}
                    {q.type === 'matching_list' && q.matchingList && (
                      <div className="my-4 rounded-2xl border border-slate-200 dark:border-zinc-800 overflow-hidden bg-slate-50/60 dark:bg-zinc-900/40">
                        <div className="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-200 dark:divide-zinc-800">
                          <div className="p-4 space-y-3">
                            <p className="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
                              List - I
                            </p>
                            <div className="space-y-3">
                              {q.matchingList.listI.map((item, idx) => (
                                <div key={idx} className="text-xs sm:text-sm text-slate-800 dark:text-zinc-200 flex items-start gap-2">
                                  <span className="font-bold text-slate-500">({item.label})</span>
                                  <div className="flex-1">
                                    <MathSpan text={item.text} />
                                    {item.image && (
                                      <img src={item.image} alt="" className="mt-1 max-h-24 rounded border p-1 bg-white" />
                                    )}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>

                          <div className="p-4 space-y-3">
                            <p className="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
                              List - II
                            </p>
                            <div className="space-y-3">
                              {q.matchingList.listII.map((item, idx) => (
                                <div key={idx} className="text-xs sm:text-sm text-slate-800 dark:text-zinc-200 flex items-start gap-2">
                                  <span className="font-bold text-slate-500">({item.label})</span>
                                  <div className="flex-1">
                                    <MathSpan text={item.text} />
                                    {item.image && (
                                      <img src={item.image} alt="" className="mt-1 max-h-24 rounded border p-1 bg-white" />
                                    )}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* OPTION SELECTION INPUTS */}
                    {(q.type === 'single_correct' || q.type === 'matching_list') && q.options && (
                      <div className="pt-2 space-y-3">
                        <p className="text-xs font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-wider">
                          Select one correct option:
                        </p>
                        <div className="grid grid-cols-1 gap-2.5">
                          {q.options.map((opt) => {
                            const isSelected = currentAns === opt.id;
                            return (
                              <button
                                key={opt.id}
                                type="button"
                                onClick={() => handleOptionSelect(opt.id)}
                                className={`w-full text-left p-4 rounded-2xl border transition-all duration-150 flex items-start gap-3.5 ${
                                  isSelected
                                    ? 'border-indigo-600 bg-indigo-50/70 dark:bg-indigo-950/40 ring-2 ring-indigo-500/20'
                                    : 'border-slate-200 dark:border-zinc-800 hover:border-slate-300 dark:hover:border-zinc-700 bg-white dark:bg-zinc-900/60'
                                }`}
                              >
                                <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 transition-colors ${
                                  isSelected
                                    ? 'bg-indigo-600 text-white'
                                    : 'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300'
                                }`}>
                                  {opt.id}
                                </span>
                                <div className="flex-1 text-xs sm:text-sm text-slate-800 dark:text-zinc-200 pt-0.5">
                                  <MathSpan text={opt.text} />
                                  {opt.image && (
                                    <img src={opt.image} alt="" className="mt-2 max-h-28 rounded-lg border p-1 bg-white" />
                                  )}
                                </div>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {q.type === 'multiple_correct' && q.options && (
                      <div className="pt-2 space-y-3">
                        <div className="flex items-center justify-between">
                          <p className="text-xs font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-wider">
                            Select one or more correct options (Partial Marking Enabled):
                          </p>
                          <span className="text-[11px] font-semibold text-purple-600 dark:text-purple-400">
                            Check all that apply
                          </span>
                        </div>
                        <div className="grid grid-cols-1 gap-2.5">
                          {q.options.map((opt) => {
                            const isChecked = Array.isArray(currentAns) && currentAns.includes(opt.id);
                            return (
                              <button
                                key={opt.id}
                                type="button"
                                onClick={() => handleOptionSelect(opt.id)}
                                className={`w-full text-left p-4 rounded-2xl border transition-all duration-150 flex items-start gap-3.5 ${
                                  isChecked
                                    ? 'border-purple-600 bg-purple-50/70 dark:bg-purple-950/40 ring-2 ring-purple-500/20'
                                    : 'border-slate-200 dark:border-zinc-800 hover:border-slate-300 dark:hover:border-zinc-700 bg-white dark:bg-zinc-900/60'
                                }`}
                              >
                                <div className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 transition-colors ${
                                  isChecked
                                    ? 'bg-purple-600 text-white shadow-sm'
                                    : 'bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300'
                                }`}>
                                  {isChecked ? '✓' : opt.id}
                                </div>
                                <div className="flex-1 text-xs sm:text-sm text-slate-800 dark:text-zinc-200 pt-0.5">
                                  <MathSpan text={opt.text} />
                                  {opt.image && (
                                    <img src={opt.image} alt="" className="mt-2 max-h-28 rounded-lg border p-1 bg-white" />

                      <div className="pt-6 mt-6 border-t border-slate-100 dark:border-zinc-800 flex items-center justify-between text-xs text-slate-500 dark:text-zinc-400">
                        <span className="font-semibold text-indigo-600 dark:text-indigo-400">Verified CBT Student</span>
                        <span>NelovMallickIITD Platform</span>
                      </div>
                    </div>
                  ))}
                </div>

              </div>
            </section>

            {/* 5. INTERACTIVE FAQS */}
            <section id="faq" className="py-20 sm:py-28 relative">
              <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
                
                <div className="text-center space-y-3">
                  <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-400 text-xs font-bold uppercase tracking-wider">
                    Frequently Asked Questions
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-zinc-50 tracking-tight">
                    Everything You Need to Know
                  </h2>
                </div>

                <div className="space-y-4">
                  {faqs.map((faq, idx) => {
                    const isOpen = faqOpenIdx === idx;
                    return (
                      <div
                        key={idx}
                        className="rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#121318] overflow-hidden shadow-sm transition-colors"
                      >
                        <button
                          type="button"
                          onClick={() => setFaqOpenIdx(isOpen ? null : idx)}
                          className="w-full p-5 text-left flex items-center justify-between gap-4 font-bold text-sm sm:text-base text-slate-900 dark:text-zinc-100"
                        >
                          <span>{faq.question}</span>
                          <span className="text-indigo-600 dark:text-indigo-400 text-lg flex-shrink-0">
                            {isOpen ? '−' : '+'}
                          </span>
                        </button>
                        {isOpen && (
                          <div className="px-5 pb-5 text-xs sm:text-sm text-slate-600 dark:text-zinc-400 leading-relaxed border-t border-slate-100 dark:border-zinc-800 pt-3">
                            {faq.answer}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

              </div>
            </section>

            {/* 6. CTA FOOTER BANNER */}
            <section className="py-16 sm:py-24 relative">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="relative rounded-3xl sm:rounded-[36px] bg-gradient-to-br from-indigo-700 via-indigo-800 to-purple-900 p-8 sm:p-14 text-white shadow-2xl shadow-indigo-900/40 text-center space-y-6 overflow-hidden">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-xs font-bold uppercase tracking-wider text-indigo-100">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                    100% Free · Mentorship by Nelov Mallick (IIT Delhi)
                  </div>
                  <h2 className="text-3xl sm:text-5xl font-extrabold tracking-tight">
                    Start Your Authentic JEE Advanced Attempt Now.
                  </h2>
                  <p className="text-sm sm:text-base text-indigo-100 max-w-xl mx-auto leading-relaxed">
                    Zero payment, zero registration lock. Attempt full syllabus mock tests PTA-04 and PTA-05 with real-time analytics.
                  </p>
                  <div className="pt-2 flex flex-col sm:flex-row items-center justify-center gap-4">
                    <button
                      type="button"
                      onClick={() => handleSelectTest('jee-advanced-pta-04')}
                      className="w-full sm:w-auto px-8 py-4 rounded-xl bg-white hover:bg-slate-100 text-indigo-950 font-extrabold text-sm shadow-xl hover:scale-105 active:scale-95 transition-all"
                    >
                      Attempt PTA 04 Free →
                    </button>
                    <button
                      type="button"
                      onClick={() => handleSelectTest('jee-advanced-pta-05')}
                      className="w-full sm:w-auto px-8 py-4 rounded-xl border border-white/30 hover:bg-white/10 text-white font-extrabold text-sm transition-all"
                    >
                      Attempt PTA 05 Free →
                    </button>
                  </div>
                </div>
              </div>
            </section>
          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#08080a] py-12 text-xs text-slate-500 dark:text-zinc-400">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-6">
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-lg bg-indigo-600 text-white font-bold text-xs flex items-center justify-center">
                  NM
                </div>
                <span className="font-extrabold text-sm text-slate-900 dark:text-zinc-100">
                  NelovMallick<span className="text-indigo-600 dark:text-indigo-400">IITD</span>
                </span>
                <span className="text-slate-400">· 100% Free JEE CBT Platform</span>
              </div>

              <p className="text-center sm:text-right">
                Curated by <span className="font-bold text-slate-800 dark:text-zinc-200">Nelov Mallick (IIT Delhi)</span> · All papers are 100% free open educational resources.
              </p>
            </div>
          </footer>

          {/* PLACEHOLDER / COMING SOON MODAL */}
          {noticeModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in fade-in">
              <div className="w-full max-w-md rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#121318] p-6 sm:p-8 shadow-2xl space-y-5">
                <div className="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-2xl flex items-center justify-center mx-auto shadow-md">
                  📄
                </div>
                <div className="text-center space-y-2">
                  <h3 className="text-lg font-bold text-slate-900 dark:text-zinc-50">
                    {noticeModal.title}
                  </h3>
                  <p className="text-xs sm:text-sm text-slate-600 dark:text-zinc-400 leading-relaxed">
                    {noticeModal.message}
                  </p>
                </div>
                <div className="pt-2 flex flex-col gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setNoticeModal(null);
                      handleSelectTest('jee-advanced-pta-04');
                    }}
                    className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md transition-all"
                  >
                    Start Live Test PTA 04 Now
                  </button>
                  <button
                    type="button"
                    onClick={() => setNoticeModal(null)}
                    className="w-full py-2.5 rounded-xl border border-slate-200 dark:border-zinc-700 text-slate-700 dark:text-zinc-300 font-semibold text-xs hover:bg-slate-50 dark:hover:bg-zinc-800"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NelovMallickApp />);
  </script>
</body>
