  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Helper: Safe KaTeX formula renderer component
    function MathSpan({ text, className = '' }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(containerRef.current, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false
            });
          } catch (e) {
            console.error('KaTeX rendering error:', e);
          }
        }
      }, [text]);

      return <span ref={containerRef} className={className}>{text}</span>;
    }

    // Helper: Format seconds to HH:MM:SS
    function formatTime(seconds) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Helper: Rich KaTeX & Markdown formatted container
    function RichMathContent({ text, className = '' }) {
      const containerRef = useRef(null);

      const formattedHtml = useMemo(() => {
        if (!text) return '';
        return String(text)
          .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900 dark:text-zinc-100">$1</strong>')
          .replace(/\n\n/g, '<div class="h-2.5"></div>')
          .replace(/\n/g, '<br/>');
      }, [text]);

      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(containerRef.current, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false
            });
          } catch (e) {
            console.error('KaTeX rendering error:', e);
          }
        }
      }, [formattedHtml]);

      return (
        <div
          ref={containerRef}
          className={className}
          dangerouslySetInnerHTML={{ __html: formattedHtml }}
        />
      );
    }

    // Helper: Format duration into readable Xm Ys
    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return '0s';
      if (seconds < 60) return `${seconds}s`;
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
    }

    
    // ==============================================================================
    // REUSABLE 3D PERSPECTIVE TILT CARD (TestonGo 3D Depth Engine)
    // ==============================================================================
    function Tilt3DCard({
      children,
      className = '',
      maxTilt = 7,
      perspective = 1000,
      glare = true,
      scale = 1.015,
      style = {},
      ...props
    }) {
      const cardRef = useRef(null);
      const [transformStyle, setTransformStyle] = useState({
        transform: `perspective(${perspective}px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`,
        transition: 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)'
      });
      const [glareStyle, setGlareStyle] = useState({
        opacity: 0,
        background: 'radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 65%)'
      });
      const [canTilt, setCanTilt] = useState(true);

      useEffect(() => {
        const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const isTouch = 'ontouchstart' in window || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
        if (prefersReducedMotion || isTouch) {
          setCanTilt(false);
        }
      }, []);

      const handlePointerMove = (e) => {
        if (!canTilt || !cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const xRatio = x / rect.width - 0.5;
        const yRatio = y / rect.height - 0.5;
        const rotX = (-yRatio * (maxTilt * 2)).toFixed(2);
        const rotY = (xRatio * (maxTilt * 2)).toFixed(2);
        const glareX = ((xRatio + 0.5) * 100).toFixed(1);
        const glareY = ((yRatio + 0.5) * 100).toFixed(1);

        setTransformStyle({
          transform: `perspective(${perspective}px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(${scale}, ${scale}, ${scale})`,
          transition: 'transform 0.08s ease-out'
        });

        if (glare) {
          setGlareStyle({
            opacity: 1,
            background: `radial-gradient(circle at ${glareX}% ${glareY}%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 65%)`,
            transition: 'opacity 0.2s ease-out'
          });
        }
      };

      const handlePointerLeave = () => {
        if (!canTilt) return;
        setTransformStyle({
          transform: `perspective(${perspective}px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`,
          transition: 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)'
        });
        if (glare) {
          setGlareStyle(prev => ({
            ...prev,
            opacity: 0,
            transition: 'opacity 0.4s ease-out'
          }));
        }
      };

      return (
        <div
          ref={cardRef}
          onPointerMove={handlePointerMove}
          onPointerLeave={handlePointerLeave}
          className={`relative select-none ${className}`}
          style={{
            ...style,
            ...transformStyle,
            transformStyle: 'preserve-3d',
            willChange: 'transform'
          }}
          {...props}
        >
          {glare && (
            <div
              aria-hidden="true"
              className="pointer-events-none absolute inset-0 rounded-[inherit] z-20 overflow-hidden"
              style={glareStyle}
            />
          )}
          {children}
        </div>
      );
    }

    // ==============================================================================
    // INTERACTIVE RESOURCE READER MODAL WITH KATEX MATH RENDERING

              <div className="prose prose-slate dark:prose-invert max-w-none space-y-4">

    function VideoLecturesShowcaseSection({ currentUser, setView, setActiveLectureChapterSlug, setActiveLectureIndex, openAuth }) {
      const [selectedSubject, setSelectedSubject] = useState('All');
      const allChaptersList = window.allChapters || [];

      const filtered = selectedSubject === 'All'
        ? allChaptersList.slice(0, 6)
        : allChaptersList.filter(function(ch) { return ch.subject === selectedSubject; }).slice(0, 6);

      const handleChapterClick = function(chapter) {
        if (setActiveLectureChapterSlug) setActiveLectureChapterSlug(chapter.slug);

    // CBT TEST SHELL MODAL (Full CBT Interactive Shell Simulation)
    function PhysicsCbtTestShellModal({ isOpen, onClose, chapter, exercise, studentName = 'Guest Aspirant' }) {
      if (!isOpen || !chapter || !exercise) return null;

      const totalQuestions = exercise.questionCount || 25;
      const [selectedQuestion, setSelectedQuestion] = useState(1);
      const [responses, setResponses] = useState({});
      const [markedForReview, setMarkedForReview] = useState([]);
      const [visitedQuestions, setVisitedQuestions] = useState([1]);
      const [timeLeft, setTimeLeft] = useState((exercise.timeMinutes || 60) * 60);
      const [showSubmitModal, setShowSubmitModal] = useState(false);

      useEffect(() => {
        if (!isOpen) return;
        const interval = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(interval);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [isOpen]);

      useEffect(() => {
        if (!visitedQuestions.includes(selectedQuestion)) {
          setVisitedQuestions(prev => [...prev, selectedQuestion]);
        }
      }, [selectedQuestion]);

      const formatTimer = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      const handleOptionSelect = (option) => {
        setResponses(prev => ({ ...prev, [selectedQuestion]: option }));
      };

      const handleClearResponse = () => {
        setResponses(prev => {
          const copy = { ...prev };
          delete copy[selectedQuestion];
          return copy;
        });
      };

      const handleMarkForReview = () => {
        if (markedForReview.includes(selectedQuestion)) {
          setMarkedForReview(prev => prev.filter(q => q !== selectedQuestion));
        } else {
          setMarkedForReview(prev => [...prev, selectedQuestion]);
        }
      };

      const handleSaveAndNext = () => {
        if (selectedQuestion < totalQuestions) {
          setSelectedQuestion(prev => prev + 1);
        }
      };

      const getQuestionPaletteStyle = (qNum) => {
        const isAnswered = !!responses[qNum];
        const isMarked = markedForReview.includes(qNum);
        const isCurrent = selectedQuestion === qNum;

        let baseClass = 'w-9 h-9 rounded-lg font-bold text-xs flex items-center justify-center transition-all ';
        if (isCurrent) baseClass += 'ring-2 ring-indigo-500 ring-offset-2 dark:ring-offset-[#11121a] ';

        if (isAnswered && isMarked) {
          return baseClass + 'bg-purple-600 text-white relative after:content-[""] after:w-2 after:h-2 after:bg-emerald-400 after:rounded-full after:absolute after:top-0.5 after:right-0.5';
        }
        if (isMarked) return baseClass + 'bg-purple-600 text-white';
        if (isAnswered) return baseClass + 'bg-emerald-600 text-white shadow-sm shadow-emerald-500/20';
        if (visitedQuestions.includes(qNum)) return baseClass + 'bg-rose-500 text-white';
        return baseClass + 'bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 hover:bg-slate-200 dark:hover:bg-zinc-700';
      };

      const answeredCount = Object.keys(responses).length;
      const markedCount = markedForReview.length;

    function LecturesHubView({ currentUser, setView, openAuth, setActiveLectureChapterSlug, setActiveLectureIndex }) {
      const [selectedSubject, setSelectedSubject] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [progressMap, setProgressMap] = useState({});

      const allChaptersList = window.allChapters || [];

      useEffect(() => {
        if (currentUser && currentUser.id && window.studentStorage) {
          const p = window.studentStorage.getLectureProgress(currentUser.id);
          setProgressMap(p || {});
        }
      }, [currentUser]);

      const filteredChapters = allChaptersList.filter(function(ch) {
        const matchSubject = selectedSubject === 'All' || ch.subject === selectedSubject;
        if (!matchSubject) return false;
        const q = searchQuery.toLowerCase().trim();
        if (!q) return true;
        if (ch.chapterName.toLowerCase().includes(q) || (ch.description && ch.description.toLowerCase().includes(q))) {
          return true;
        }
        return (ch.lectures || []).some(function(l) { return l.title.toLowerCase().includes(q); });
      });

      const handleChapterClick = function(chapter) {
        if (setActiveLectureChapterSlug) setActiveLectureChapterSlug(chapter.slug);
        if (setActiveLectureIndex) setActiveLectureIndex(1);
        if (setView) setView('lecture-player');
        window.location.hash = '#/lectures/' + chapter.slug;
      };

      const subjectBadges = {
        Chemistry: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800',

    function LecturePlayerView({ chapterSlug, initialLectureIndex, currentUser, setView, openAuth, setActiveLectureChapterSlug, setActiveLectureIndex }) {
      const allChaptersList = window.allChapters || [];
      const chapter = (allChaptersList.find(function(c) { return c.slug === chapterSlug; })) || allChaptersList[0];

      const [activeLecNum, setActiveLecNum] = useState(initialLectureIndex || 1);
      const [personalNote, setPersonalNote] = useState('');
      const [noteSaved, setNoteSaved] = useState(false);
      const [progressMap, setProgressMap] = useState({});

      useEffect(() => {
        if (initialLectureIndex && initialLectureIndex > 0) {
          setActiveLecNum(initialLectureIndex);
        }
      }, [initialLectureIndex]);

      useEffect(() => {
        if (currentUser && currentUser.id && window.studentStorage) {
          const p = window.studentStorage.getLectureProgress(currentUser.id);
          setProgressMap(p || {});
        }
      }, [currentUser]);

      const currentLecture = chapter && chapter.lectures && chapter.lectures.length > 0
        ? (chapter.lectures[activeLecNum - 1] || chapter.lectures[0])
        : null;

      useEffect(() => {
        if (currentLecture && currentUser && currentUser.id) {
          const saved = (progressMap[currentLecture.videoId] && progressMap[currentLecture.videoId].personalNote) || '';
          setPersonalNote(saved);
          setNoteSaved(false);
        }
      }, [currentLecture, currentUser, progressMap]);

      if (!chapter) {
        return (
          <div className="min-h-screen bg-slate-50 dark:bg-[#0a0a0c] text-slate-900 dark:text-zinc-50 flex items-center justify-center p-6">

                onClick={function() { if (setView) setView('lectures'); window.location.hash = '#/lectures'; }}
                className="px-5 py-2.5 rounded-xl bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-bold text-xs"
              >
                ← Return to Lectures Hub
              </button>
            </div>
          </div>
        );
      }

      const isCompleted = currentLecture && !!(progressMap[currentLecture.videoId] && progressMap[currentLecture.videoId].completed);

      const handleToggleComplete = async function() {
        if (!currentUser || !currentUser.id) {
          if (openAuth) openAuth('login', '#/lectures/' + chapter.slug + '?lec=' + activeLecNum, 'Sign in free to track your lecture progress.');
          return;

        const newCompleted = !isCompleted;
        if (window.studentStorage && window.studentStorage.saveLectureProgress) {
          await window.studentStorage.saveLectureProgress(
            currentUser.id,
            chapter.slug,
            currentLecture.videoId,
            currentLecture.lectureNumber,
            newCompleted,
            personalNote
          );
        }

        setProgressMap(function(prev) {
          const updated = Object.assign({}, prev);
          updated[currentLecture.videoId] = Object.assign({}, updated[currentLecture.videoId], {
            completed: newCompleted,
            personalNote: personalNote
          });
          return updated;
        });
      };

      const handleSaveNote = async function() {
        if (!currentUser || !currentUser.id) {
          if (openAuth) openAuth('login', '#/lectures/' + chapter.slug + '?lec=' + activeLecNum, 'Sign in free to save personal notes.');
          return;

            currentUser.id,
            chapter.slug,
            currentLecture.videoId,
            currentLecture.lectureNumber,
            isCompleted,
            personalNote
          );

          const updated = Object.assign({}, prev);
          updated[currentLecture.videoId] = Object.assign({}, updated[currentLecture.videoId], {
            completed: isCompleted,
            personalNote: personalNote
          });
          return updated;
        });

        setTimeout(function() { setNoteSaved(false); }, 2000);

    // COMPONENT: Subject-wise Score & Accuracy Chart (Grouped Bar Chart)
    function SubjectScoreAccuracyChart({ subjectStats }) {
      const [hovered, setHovered] = useState(null);
      const subjects = Object.entries(subjectStats || {});
      if (subjects.length === 0) return null;

      const maxVal = Math.max(...subjects.map(([_, d]) => Math.max(d.max || 60, d.scored || 0)), 60);

      return (
        <div className="rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#12131a] p-6 shadow-sm space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 dark:border-zinc-800 pb-3">

                <span>📊</span> Subject-wise Score & Accuracy
              </h4>
              <p className="text-[11px] text-slate-500 dark:text-zinc-400">
                Compare Scored Marks vs. Maximum Marks & Accuracy %
              </p>
            </div>
            <div className="flex items-center gap-3 text-xs">
              <span className="flex items-center gap-1.5 text-slate-500 dark:text-zinc-400">
                <span className="w-3 h-3 rounded-sm bg-slate-200 dark:bg-zinc-700 inline-block" /> Max Marks
              </span>
              <span className="flex items-center gap-1.5 text-indigo-600 dark:text-indigo-400 font-semibold">
                <span className="w-3 h-3 rounded-sm bg-indigo-600 inline-block" /> Scored Marks
              </span>
            </div>
          </div>

          <div className="w-full overflow-x-auto">
            <svg viewBox="0 0 450 190" className="w-full h-auto min-w-[320px]">
              <defs>
                <linearGradient id="scoredGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#6366f1" />
                  <stop offset="100%" stopColor="#4338ca" />
                </linearGradient>
                <linearGradient id="hoverGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#818cf8" />
                  <stop offset="100%" stopColor="#4f46e5" />
                </linearGradient>
              </defs>

              {[0, 0.25, 0.5, 0.75, 1].map((pct, i) => {
                const y = 140 - pct * 110;
                const val = Math.round(pct * maxVal);
                return (
                  <g key={i}>
                    <line x1="45" y1={y} x2="430" y2={y} stroke="currentColor" className="text-slate-100 dark:text-zinc-800" strokeDasharray="3 3" />
                    <text x="38" y={y + 3} textAnchor="end" className="text-[10px] fill-slate-400 dark:fill-zinc-500 font-mono">
                      {val}
                    </text>
                  </g>
                );
              })}

              {subjects.map(([subj, data], idx) => {
                const groupX = 60 + idx * 125;
                const maxH = Math.max(4, (data.max / maxVal) * 110);
                const scoredH = Math.max(0, (Math.max(0, data.scored) / maxVal) * 110);
                const maxBarY = 140 - maxH;
                const scoredBarY = 140 - scoredH;
                const acc = data.attempted > 0 ? Math.round(((data.correct + data.partial) / data.attempted) * 100) : 0;
                const isHov = hovered === subj;

                return (
                  <g
                    key={subj}
                    className="cursor-pointer transition-all"
                    onMouseEnter={() => setHovered(subj)}
                    onMouseLeave={() => setHovered(null)}
                  >
                    <rect
                      x={groupX}
                      y={maxBarY}
                      width="38"
                      height={maxH}
                      rx="6"
                      className="fill-slate-100 dark:fill-zinc-800 transition-colors"
                    />
                    <text
                      x={groupX + 19}
                      y={maxBarY - 5}
                      textAnchor="middle"
                      className="text-[10px] font-mono fill-slate-400 dark:fill-zinc-500"
                    >
                      {data.max}M
                    </text>

                    <rect
                      x={groupX + 44}
                      y={scoredBarY}
                      width="38"
                      height={scoredH}
                      rx="6"
                      fill={isHov ? 'url(#hoverGrad)' : 'url(#scoredGrad)'}
                      className="transition-all"
                    />
                    <text
                      x={groupX + 63}
                      y={scoredBarY - 5}
                      textAnchor="middle"
                      className="text-[10px] font-mono font-bold fill-indigo-600 dark:fill-indigo-400"
                    >
                      {data.scored}M
                    </text>

                    <text
                      x={groupX + 41}
                      y="160"
                      textAnchor="middle"
                      className="text-[11px] font-bold fill-slate-800 dark:fill-zinc-200"
                    >
                      {subj === 'Mathematics' ? 'Maths' : subj}
                    </text>

                    <rect
                      x={groupX + 15}
                      y="168"
                      width="52"
                      height="16"
                      rx="8"
                      className={acc >= 75 ? 'fill-emerald-100 dark:fill-emerald-950' : acc >= 50 ? 'fill-indigo-100 dark:fill-indigo-950' : 'fill-amber-100 dark:fill-amber-950'}
                    />
                    <text
                      x={groupX + 41}
                      y="180"
                      textAnchor="middle"
                      className={`text-[9px] font-extrabold ${acc >= 75 ? 'fill-emerald-700 dark:fill-emerald-400' : acc >= 50 ? 'fill-indigo-700 dark:fill-indigo-400' : 'fill-amber-700 dark:fill-amber-400'}`}
                    >
                      {acc}% Acc
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>

          <div className="pt-2 border-t border-slate-100 dark:border-zinc-800/80 text-xs flex flex-wrap items-center justify-between gap-2">

            ) : (
              <span className="text-[11px] text-slate-400 dark:text-zinc-500 italic">
                Hover over any subject bar to view exact question accuracy breakdown.
              </span>
            )}
          </div>
        </div>
      );

    // COMPONENT: Attempt Breakdown Donut Chart
    function AttemptBreakdownDonutChart({ correct, partial, incorrect, unattempted, accuracy, attemptedCount, totalQuestions }) {
      const [hoveredIdx, setHoveredIdx] = useState(null);

      const total = totalQuestions || (correct + partial + incorrect + unattempted) || 1;
      const segments = [
        { label: 'Fully Correct', count: correct, color: '#10b981', hoverColor: '#34d399', textClass: 'text-emerald-600' },
        { label: 'Partially Correct', count: partial, color: '#f59e0b', hoverColor: '#fbbf24', textClass: 'text-amber-600' },
        { label: 'Incorrect', count: incorrect, color: '#ef4444', hoverColor: '#f87171', textClass: 'text-rose-600' },
        { label: 'Unattempted', count: unattempted, color: '#94a3b8', hoverColor: '#cbd5e1', textClass: 'text-slate-500' }
      ].filter(s => s.count > 0);

      const radius = 68;
      const strokeWidth = 26;
      const cx = 100;
      const cy = 100;
      const circumference = 2 * Math.PI * radius;

      let currentOffset = 0;
      const arcs = segments.map((seg, i) => {
        const fraction = seg.count / total;
        const strokeDasharray = `${fraction * circumference} ${circumference}`;
        const strokeDashoffset = -currentOffset;
        currentOffset += fraction * circumference;
        const pct = Math.round((seg.count / total) * 100);
        return { ...seg, strokeDasharray, strokeDashoffset, pct, index: i };
      });

      return (
        <div className="rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#12131a] p-6 shadow-sm space-y-4">
          <div className="border-b border-slate-100 dark:border-zinc-800 pb-3">
            <h4 className="text-sm font-extrabold text-slate-900 dark:text-zinc-50 flex items-center gap-1.5">
              <span>🎯</span> Attempt & Accuracy Breakdown
            </h4>
            <p className="text-[11px] text-slate-500 dark:text-zinc-400">
              Distribution of answered, partial, incorrect & skipped questions
            </p>
          </div>

          <div className="flex flex-col sm:flex-row items-center justify-center gap-6 py-2">
            <div className="relative w-44 h-44 flex-shrink-0">
              <svg viewBox="0 0 200 200" className="w-full h-full transform -rotate-90">
                <circle cx={cx} cy={cy} r={radius} fill="none" stroke="currentColor" className="text-slate-100 dark:text-zinc-800/80" strokeWidth={strokeWidth} />
                {arcs.map((arc) => {
                  const isHov = hoveredIdx === arc.index;
                  return (
                    <circle
                      key={arc.label}
                      cx={cx}

                      strokeDashoffset={arc.strokeDashoffset}
                      className="cursor-pointer transition-all duration-200"
                      onMouseEnter={() => setHoveredIdx(arc.index)}

    // Adaptive Scoring Engine: supports JEE Mains (+4 / -1) and JEE Advanced (multi-correct partials) with Time & Format Analytics
    function evaluatePaper(testPaper, responses, questionTimes = {}) {
      const isJeeMains = testPaper.examType === 'JEE Mains' || testPaper.examCategory === 'jee-mains';
      let totalMarksScored = 0;
      let totalMaxMarks = testPaper.maxMarks || (isJeeMains ? 300 : 180);
      let attemptedCount = 0;
      let correctCount = 0;
      let partialCount = 0;
      let incorrectCount = 0;
      let unattemptedCount = 0;

      const subjectStats = {
        Mathematics: { scored: 0, max: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, timeSpent: 0 },
        Physics: { scored: 0, max: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, timeSpent: 0 },
        Chemistry: { scored: 0, max: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, timeSpent: 0 },
      };

      const questionTypeStats = {
        single_correct: { label: 'Single Correct MCQ', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        multiple_correct: { label: 'Multiple Correct MCQ', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        numerical: { label: 'Numerical Value', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        integer: { label: 'Integer Value', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        matching_list: { label: 'Match-the-List', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
        comprehension: { label: 'Comprehension / Paragraph', total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 },
      };

      let totalTimeSpent = 0;
      let correctTime = 0, correctTimeCount = 0;
      let incorrectTime = 0, incorrectTimeCount = 0;
      let unattemptedTime = 0, unattemptedTimeCount = 0;

      const questionBreakdown = testPaper.questions.map((q) => {
        const studentResp = responses[q.id];
        const marking = q.marking || {};
        const pos = marking.positive !== undefined ? marking.positive : (isJeeMains ? 4 : (q.type === 'multiple_correct' ? 4 : 3));
        const neg = marking.negative !== undefined ? marking.negative : (isJeeMains ? 1 : (q.type === 'multiple_correct' ? 2 : 1));
        const correctAns = q.answer;
        const qTime = questionTimes[q.id] || 0;
        totalTimeSpent += qTime;

        const subj = q.subject || 'Mathematics';
        if (!subjectStats[subj]) {
          subjectStats[subj] = { scored: 0, max: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, timeSpent: 0 };
        }
        subjectStats[subj].max += pos;
        subjectStats[subj].timeSpent = (subjectStats[subj].timeSpent || 0) + qTime;

        const typeKey = q.type || 'single_correct';
        if (!questionTypeStats[typeKey]) {
          questionTypeStats[typeKey] = { label: typeKey, total: 0, attempted: 0, correct: 0, partial: 0, incorrect: 0, scored: 0, max: 0 };
        }
        questionTypeStats[typeKey].total++;
        questionTypeStats[typeKey].max += pos;

        // Check if unattempted
        const isUnattempted = studentResp === undefined || studentResp === null ||
          (typeof studentResp === 'string' && studentResp.trim() === '') ||
          (Array.isArray(studentResp) && studentResp.length === 0);

        if (isUnattempted) {
          unattemptedCount++;
          unattemptedTime += qTime;
          unattemptedTimeCount++;
          return {
            question: q,
            studentResp: null,
            correctAns,
            marksAwarded: 0,
            status: 'unattempted',
            statusLabel: 'Unattempted',
            timeSpent: qTime
          };
        }

        attemptedCount++;
        subjectStats[subj].attempted++;
        questionTypeStats[typeKey].attempted++;

        // 1. Single Correct & Matching List
        if (q.type === 'single_correct' || q.type === 'matching_list') {
          const isCorrect = String(studentResp).trim().toUpperCase() === String(correctAns).trim().toUpperCase();
          const marks = isCorrect ? pos : -neg;
          totalMarksScored += marks;
          subjectStats[subj].scored += marks;
          questionTypeStats[typeKey].scored += marks;

          if (isCorrect) {
            correctCount++;
            correctTime += qTime;
            correctTimeCount++;
            subjectStats[subj].correct++;
            questionTypeStats[typeKey].correct++;
          } else {
            incorrectCount++;
            incorrectTime += qTime;
            incorrectTimeCount++;
            subjectStats[subj].incorrect++;
            questionTypeStats[typeKey].incorrect++;
          }

          return {
            question: q,
            studentResp,
            correctAns,
            marksAwarded: marks,
            status: isCorrect ? 'correct' : 'incorrect',
            statusLabel: isCorrect ? `Full Marks (+${pos})` : `Incorrect (-${neg})`,
            timeSpent: qTime
          };
        }

        // 2. Numerical / Integer
        if (q.type === 'numerical' || q.type === 'integer') {
          const sVal = parseFloat(String(studentResp).trim());
          const cVal = parseFloat(String(correctAns).trim());
          const isCorrect = !isNaN(sVal) && !isNaN(cVal) && Math.abs(sVal - cVal) < 0.05;
          const marks = isCorrect ? pos : -neg;
          totalMarksScored += marks;
          subjectStats[subj].scored += marks;
          questionTypeStats[typeKey].scored += marks;

          if (isCorrect) {
            correctCount++;
            correctTime += qTime;
            correctTimeCount++;
            subjectStats[subj].correct++;
            questionTypeStats[typeKey].correct++;
          } else {
            incorrectCount++;
            incorrectTime += qTime;
            incorrectTimeCount++;
            subjectStats[subj].incorrect++;
            questionTypeStats[typeKey].incorrect++;
          }

          return {
            question: q,
            studentResp,
            correctAns,
            marksAwarded: marks,
            status: isCorrect ? 'correct' : 'incorrect',
            statusLabel: isCorrect ? `Correct (+${pos})` : `Incorrect (-${neg})`,
            timeSpent: qTime
          };
        }

        // 3. Multiple Correct Option (JEE Advanced Official Partial Marking)
        if (q.type === 'multiple_correct') {
          const correctArr = Array.isArray(correctAns) ? correctAns : [correctAns];
          const studentArr = Array.isArray(studentResp) ? studentResp : [studentResp];

          const correctSet = new Set(correctArr.map(s => String(s).trim().toUpperCase()));
          const studentSet = new Set(studentArr.map(s => String(s).trim().toUpperCase()));

          let hasWrong = false;
          for (const opt of studentSet) {
            if (!correctSet.has(opt)) {
              hasWrong = true;
              break;
            }
          }

          if (hasWrong) {
            const marks = -neg;
            totalMarksScored += marks;
            subjectStats[subj].scored += marks;
            questionTypeStats[typeKey].scored += marks;
            incorrectCount++;
            incorrectTime += qTime;
            incorrectTimeCount++;
            subjectStats[subj].incorrect++;
            questionTypeStats[typeKey].incorrect++;
            return {
              question: q,
              studentResp: Array.from(studentSet).sort(),
              correctAns: Array.from(correctSet).sort(),
              marksAwarded: marks,
              status: 'incorrect',
              statusLabel: `Incorrect (-${neg})`,
              timeSpent: qTime
            };
          }

          // All correct selected!
          if (studentSet.size === correctSet.size) {
            totalMarksScored += pos;
            subjectStats[subj].scored += pos;
            questionTypeStats[typeKey].scored += pos;
            correctCount++;
            correctTime += qTime;
            correctTimeCount++;
            subjectStats[subj].correct++;
            questionTypeStats[typeKey].correct++;
            return {
              question: q,
              studentResp: Array.from(studentSet).sort(),
              correctAns: Array.from(correctSet).sort(),
              marksAwarded: pos,
              status: 'correct',
              statusLabel: `Full Marks (+${pos})`,
              timeSpent: qTime
            };
          }

          // Partial Marking
          let partialMarks = 1;
          if (correctSet.size === 4 && studentSet.size === 3) {
            partialMarks = 3;
          } else if (correctSet.size >= 3 && studentSet.size === 2) {
            partialMarks = 2;
          } else if (correctSet.size >= 2 && studentSet.size === 1) {
            partialMarks = 1;
          } else {
            partialMarks = Math.min(studentSet.size, pos);
          }

          totalMarksScored += partialMarks;
          subjectStats[subj].scored += partialMarks;
          questionTypeStats[typeKey].scored += partialMarks;
          partialCount++;
          correctTime += qTime;
          correctTimeCount++;
          subjectStats[subj].partial++;
          questionTypeStats[typeKey].partial++;

          return {
            question: q,
            studentResp: Array.from(studentSet).sort(),
            correctAns: Array.from(correctSet).sort(),
            marksAwarded: partialMarks,
            status: 'partial',
            statusLabel: `Partial Marks (+${partialMarks})`,
            timeSpent: qTime
          };
        }

        return {
          question: q,
          studentResp,
          correctAns,
          marksAwarded: 0,
          status: 'unattempted',
          statusLabel: 'Unattempted',
          timeSpent: qTime
        };
      });

      const accuracy = attemptedCount > 0 ? Math.round(((correctCount + partialCount) / attemptedCount) * 100) : 0;
      const percentage = Math.round((totalMarksScored / totalMaxMarks) * 100);

      // Finalize question type accuracy
      Object.values(questionTypeStats).forEach(item => {
        item.accuracy = item.attempted > 0 ? Math.round(((item.correct + item.partial) / item.attempted) * 100) : 0;
      });

      const avgCorrectTime = correctTimeCount > 0 ? Math.round(correctTime / correctTimeCount) : 0;
      const avgIncorrectTime = incorrectTimeCount > 0 ? Math.round(incorrectTime / incorrectTimeCount) : 0;
      const avgUnattemptedTime = unattemptedTimeCount > 0 ? Math.round(unattemptedTime / unattemptedTimeCount) : 0;
      const isTimeTrap = avgIncorrectTime > avgCorrectTime && avgIncorrectTime > 40;

      const timeAnalysis = {
        totalTimeSpent,
        avgCorrectTime,
        avgIncorrectTime,
        avgUnattemptedTime,
        isTimeTrap
      };

      // Calculate Rank Prediction
      let rankPrediction = null;
      if (isJeeMains && typeof window.predictJeeMainsRank === 'function') {
        rankPrediction = window.predictJeeMainsRank(totalMarksScored, totalMaxMarks);
      } else if (typeof window.predictJeeAdvancedRank === 'function') {
        rankPrediction = window.predictJeeAdvancedRank(totalMarksScored, totalMaxMarks);
      }

      return {
        totalMarksScored,
        totalMaxMarks,
        attemptedCount,
        correctCount,
        partialCount,
        incorrectCount,
        unattemptedCount,
        accuracy,
        percentage,
        subjectStats,
        questionTypeStats,
        timeAnalysis,
        rankPrediction,
        questionBreakdown
      };
    }


    // COMPONENT: Free User Authentication Modal (Log In / Sign Up / Forgot Password)
    function AuthModalDialog({ isOpen, mode: initialMode, redirectUrl, message, onClose, onAuthSuccess }) {
      const [authMode, setAuthMode] = useState(initialMode || 'login');
      const [authTab, setAuthTab] = useState('email');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [contactNumber, setContactNumber] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [targetExam, setTargetExam] = useState('JEE Advanced');
      const [showPassword, setShowPassword] = useState(false);
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (initialMode) setAuthMode(initialMode);
        setError('');
        setSuccessMsg('');
      }, [initialMode, isOpen]);

      if (!isOpen) return null;

      const isGmail = (email || '').trim().toLowerCase().endsWith('@gmail.com');
      const isNonGmailEntered = Boolean(email.trim() && !isGmail);

      const isValidPhone = (num) => {
        const clean = (num || '').replace(/[\s\-\(\)\+]/g, '');
        const digits = clean.startsWith('91') && clean.length > 10 ? clean.substring(2) : (clean.startsWith('0') && clean.length === 11 ? clean.substring(1) : clean);
        return /^[6-9]\d{9}$/.test(digits);
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          let user;
          if (authTab === 'email') {
            if (!email.trim()) throw new Error('Please enter your email address.');
            user = await window.authService.logIn({ email: email.trim(), password });
          } else {
            if (!contactNumber.trim()) throw new Error('Please enter your 10-digit contact number.');
            if (!isValidPhone(contactNumber)) throw new Error('Please enter a valid 10-digit mobile number.');
            user = await window.authService.logIn({ contactNumber: contactNumber.trim(), password });
          }
          setSuccessMsg('Logged in successfully!');
          onAuthSuccess(user, redirectUrl);
        } catch (err) {
          setError(err.message || 'Login failed. Please check your credentials.');
        } finally {

    function ReportErrorModalDialog({ isOpen, questionInfo, currentUser, onClose, onSuccess }) {
      if (!isOpen || !questionInfo) return null;

      const [issueType, setIssueType] = useState('wrong_answer_key');
      const [description, setDescription] = useState('');
      const [loading, setLoading] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [error, setError] = useState('');

      const categories = [
        { type: 'wrong_answer_key', label: 'Disputed Answer Key', icon: '⚖️' },
        { type: 'broken_equation', label: 'Broken Formula / Diagram', icon: '📐' },
        { type: 'typo', label: 'Typo / Wording Issue', icon: '✍️' },
        { type: 'missing_diagram', label: 'Unclear Explanation', icon: '💡' },
        { type: 'other', label: 'Other Feedback', icon: '💬' },
      ];

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!description.trim()) {
          setError('Please provide a brief description of the issue.');
          return;
        }

        setLoading(true);
        setError('');

        try {
          if (window.studentStorage?.submitErrorReport) {
            await window.studentStorage.submitErrorReport({
              userId: currentUser ? currentUser.id : null,
              reporterName: currentUser ? currentUser.name : 'Anonymous Aspirant',
              reporterEmail: currentUser ? currentUser.email : '',
              testId: questionInfo.testId,
              examType: questionInfo.examType,
              testCode: questionInfo.testCode,
              questionId: String(questionInfo.questionId),
              questionNumber: Number(questionInfo.questionNumber || questionInfo.questionId),
              issueType,
              description: description.trim()
            });
          }

          // Mark as reported in session storage to prevent duplicates
          sessionStorage.setItem(`nelov_reported_${questionInfo.testId}_${questionInfo.questionId}`, 'true');

          setSubmitted(true);
          if (onSuccess) onSuccess(questionInfo.questionId);
          setTimeout(() => {
            setSubmitted(false);
            setDescription('');
            onClose();
          }, 1500);
        } catch (err) {
          setError(err.message || 'Failed to submit report. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in fade-in">
          <div className="relative w-full max-w-lg rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#121318] p-6 sm:p-8 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
            <button
              onClick={onClose}
              className="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200 rounded-full hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors"
              aria-label="Close Modal"
            >
              ✕
            </button>

            <div className="space-y-1.5">
              <div className="flex items-center gap-2">
                <span className="p-2 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800 text-sm">
                  🚩
                </span>
                <div>
                  <h3 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-zinc-50">
                    Report an Issue
                  </h3>
                  <p className="text-xs text-slate-500 dark:text-zinc-400">
                    Help improve questions and answer keys for all JEE aspirants
                  </p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2 pt-2">
                <span className="px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 font-bold text-xs">
                  {questionInfo.examType}
                </span>
                <span className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-zinc-800 text-slate-800 dark:text-zinc-200 font-bold text-xs">
                  {questionInfo.testCode}
                </span>
                <span className="px-2.5 py-1 rounded-lg bg-amber-50 dark:bg-amber-950/50 text-amber-700 dark:text-amber-300 font-bold text-xs">
                  Question #{questionInfo.questionNumber || questionInfo.questionId}
                </span>
              </div>
            </div>

            {submitted ? (
              <div className="py-8 text-center space-y-3">
                <div className="w-14 h-14 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-2xl mx-auto">
                  ✓
                </div>
                <h4 className="text-base font-extrabold text-slate-900 dark:text-zinc-50">
                  Report Submitted Successfully!
                </h4>
                <p className="text-xs text-slate-500 dark:text-zinc-400 max-w-xs mx-auto">
                  Thank you! Your feedback has been forwarded to the academic review panel.
                </p>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4 text-xs">
                {error && (
                  <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-xs text-rose-600 dark:text-rose-400">
                    {error}
                  </div>
                )}

                <div className="space-y-1.5">
                  <label className="font-bold text-slate-700 dark:text-zinc-300">
                    Select Issue Category
                  </label>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {categories.map((c) => (
                      <button
                        key={c.type}
                        type="button"
                        onClick={() => setIssueType(c.type)}
                        className={`p-2.5 rounded-xl border text-left flex items-center gap-2 transition-all ${
                          issueType === c.type
                            ? 'border-indigo-600 bg-indigo-50/80 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 font-bold shadow-sm'
                            : 'border-slate-200 dark:border-zinc-800 text-slate-600 dark:text-zinc-400 hover:border-slate-300'
                        }`}
                      >
                        <span>{c.icon}</span>
                        <span className="text-[11px] font-semibold">{c.label}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-1.5">
                  <label className="font-bold text-slate-700 dark:text-zinc-300">
                    Details & Observations
                  </label>
                  <textarea
                    required
                    rows="4"
                    value={description}
                    onChange={(e) => setDescription(e.target.value)}
                    placeholder="Describe why you believe the answer key or formula is incorrect, or provide your step-by-step counter-derivation..."
                    className="w-full p-3 rounded-xl border border-slate-200 dark:border-zinc-700 bg-slate-50 dark:bg-zinc-900 text-slate-900 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs"
                  />
                </div>

                <div className="p-3 rounded-xl bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 text-[11px] text-slate-500 dark:text-zinc-400 flex items-center justify-between">
                  <span>Submitting as: <strong className="text-slate-800 dark:text-zinc-200">{currentUser ? currentUser.name : 'Aspirant'}</strong></span>
                  <span className="text-emerald-600 dark:text-emerald-400 font-semibold">✓ Verified Review</span>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-zinc-800 text-slate-700 dark:text-zinc-300 font-bold hover:bg-slate-50 dark:hover:bg-zinc-800"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    disabled={loading}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold shadow-md shadow-indigo-600/30 disabled:opacity-50 transition-all"
                  >
                    {loading ? 'Submitting...' : 'Send Error Report 🚀'}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // VIEW: Private Admin Dashboard Component (/admin)
    // Full Visibility for Admin Gmail (Students, Contact Numbers, Attempts, Lectures, Bookmarks, Reports)
    // =========================================================================
    function AdminDashboardView({ currentUser, setView, testConfigs, setTestConfigs }) {
      const [adminTab, setAdminTab] = useState('overview');
      const [loading, setLoading] = useState(true);

      // Core Data States
      const [students, setStudents] = useState([]);
      const [allAttempts, setAllAttempts] = useState([]);
      const [allBookmarks, setAllBookmarks] = useState([]);
      const [allLectures, setAllLectures] = useState([]);
      const [reports, setReports] = useState([]);

      // Filters & Modals
      const [studentSearch, setStudentSearch] = useState('');
      const [studentAuthFilter, setStudentAuthFilter] = useState('All');
      const [studentExamFilter, setStudentExamFilter] = useState('All');
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [copiedPhone, setCopiedPhone] = useState(null);

      // Attempts Tab Filters
      const [attemptSearch, setAttemptSearch] = useState('');
      const [attemptExamFilter, setAttemptExamFilter] = useState('All');
      const [attemptCodeFilter, setAttemptCodeFilter] = useState('All');

      // Error Reports Tab States
      const [reportFilter, setReportFilter] = useState('All');
      const [adminNotes, setAdminNotes] = useState({});
      const [savedNoteId, setSavedNoteId] = useState(null);

      // Test Configs Modal
      const [confirmModal, setConfirmModal] = useState(null);

      const isCloudConnected = window.authService?.isCloudConnected ? window.authService.isCloudConnected() : false;

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        setLoading(true);
        try {
          let pList = [];
          if (window.studentStorage?.getAllProfiles) {
            pList = await window.studentStorage.getAllProfiles();
          }
          if ((!pList || pList.length === 0) && window.authService?.getAllUsers) {
            pList = window.authService.getAllUsers() || [];
          }

          let atts = [];
          if (window.studentStorage?.getAllAttempts) {
            atts = await window.studentStorage.getAllAttempts();
            setAllAttempts(atts || []);
          }

          let bks = [];
          if (window.studentStorage?.getAllBookmarks) {
            bks = await window.studentStorage.getAllBookmarks();
            setAllBookmarks(bks || []);
          }

          let lecs = [];
          if (window.studentStorage?.getAllLectureProgress) {
            lecs = await window.studentStorage.getAllLectureProgress();
            setAllLectures(lecs || []);
          }

          let rList = [];
          if (window.studentStorage?.getAllErrorReports) {
            rList = await window.studentStorage.getAllErrorReports();
            setReports(rList || []);
          }

          if (window.studentStorage?.getTestConfigs) {
            const cfg = await window.studentStorage.getTestConfigs();
            if (cfg && Object.keys(cfg).length > 0) {
              setTestConfigs(cfg);
            }
          }

          const normalized = (pList || []).map((p) => {
            const rawEmail = p.email || '';
            const isSynthetic = rawEmail.endsWith('@phone.nelovportal.local');
            return {
              id: p.id || p.userId || p.user_id,
              name: p.full_name || p.name || 'Student Aspirant',
              email: isSynthetic ? '' : rawEmail,
              contact_number: p.contact_number || p.contactNumber || '',
              auth_method: p.auth_method || p.authMethod || (p.contact_number ? 'phone' : 'gmail'),
              target_exam: p.target_exam || p.targetExam || 'JEE Advanced',
              role: p.role || 'student',
              created_at: p.created_at || p.createdAt || new Date().toISOString()
            };
          });
          setStudents(normalized);
        } catch (e) {
          console.warn('Error loading admin portal data:', e);
        } finally {
          setLoading(false);
        }
      };

      const handleCopyPhone = (phone) => {
        if (!phone) return;
        navigator.clipboard.writeText(phone);
        setCopiedPhone(phone);
        setTimeout(() => setCopiedPhone(null), 2000);
      };

      const handleExportStudentsCSV = () => {
        if (students.length === 0) {
          alert('No student records found to export.');
          return;
        }

        const headers = ['Full Name', 'Gmail / Email', 'Contact Number', 'Login Method', 'Target Exam', 'Role', 'Joined Date', 'Tests Attempted', 'Avg Score %', 'Lectures Completed', 'Bookmarks'];
        const rows = students.map((s) => {
          const sId = s.id;
          const studentAttempts = allAttempts.filter((a) => (a.userId === sId || a.user_id === sId));
          const studentLectures = allLectures.filter((l) => (l.user_id === sId || l.userId === sId) && l.completed);
          const studentBookmarks = allBookmarks.filter((b) => (b.user_id === sId || b.userId === sId));
          const avgScore = studentAttempts.length > 0
            ? Math.round(studentAttempts.reduce((acc, a) => acc + (a.percentage || 0), 0) / studentAttempts.length)
            : 0;

          return [
            `"${(s.name || 'Student').replace(/"/g, '""')}"`,
            `"${(s.email || '').replace(/"/g, '""')}"`,
            `"${(s.contact_number || '').replace(/"/g, '""')}"`,
            `"${s.auth_method || (s.contact_number ? 'phone' : 'gmail')}"`,
            `"${s.target_exam || 'JEE Advanced'}"`,
            `"${s.role || 'student'}"`,
            `"${s.created_at ? new Date(s.created_at).toLocaleDateString() : ''}"`,
            studentAttempts.length,
            `${avgScore}%`,
            studentLectures.length,
            studentBookmarks.length
          ].join(',');
        });

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `nelovmallick_students_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

      const jeeAdvancedTestsList = Array.from({ length: 10 }, (_, i) => {
        const num = String(i + 1).padStart(2, '0');
        const testId = `jee-advanced-pta-${num}`;
        let count = 0;
        if (num === '04') count = 57;
        else if (num === '05') count = 54;
        else if (num === '06') count = 51;
        return {
          testId,
          code: `PTA ${num}`,
          examType: 'JEE Advanced',
          title: `JEE Advanced – PTA ${num} Full Syllabus Mock Test`,
          questionCount: count
        };
      });

      const jeeMainsTestsList = Array.from({ length: 10 }, (_, i) => {
        const num = String(i + 1).padStart(2, '0');
        const testId = `jee-mains-ptm-${num}`;
        return {
          testId,
          code: `PTM ${num}`,
          examType: 'JEE Mains',
          title: `JEE Mains – PTM ${num} Full Syllabus Mock Test`,

        };

        const currentStatus = testConfigs[test.testId] || 'coming_soon';
        const newStatus = currentStatus === 'live' ? 'coming_soon' : 'live';

        if (newStatus === 'live' && test.questionCount === 0) {
          setConfirmModal({
            testId: test.testId,
            code: test.code,
            newStatus
          });
          return;
        }

        applyTestStatus(test.testId, newStatus);
      };

      const applyTestStatus = async (testId, status) => {
        setTestConfigs(prev => ({ ...prev, [testId]: status }));
        if (window.studentStorage?.updateTestConfigStatus) {
          await window.studentStorage.updateTestConfigStatus(testId, status);
        }
        setConfirmModal(null);
      };

      const handleReportStatusChange = async (reportId, newStatus) => {
        const note = adminNotes[reportId];
        if (window.studentStorage?.updateErrorReportStatus) {
          await window.studentStorage.updateErrorReportStatus(reportId, newStatus, note);
        }
        setReports(prev => prev.map(r => r.id === reportId ? { ...r, status: newStatus, adminNote: note || r.adminNote } : r));
      };

      const handleSaveNote = async (reportId) => {
        const note = adminNotes[reportId];
        const r = reports.find(item => item.id === reportId);
        if (!r) return;
        if (window.studentStorage?.updateErrorReportStatus) {
          await window.studentStorage.updateErrorReportStatus(reportId, r.status, note);
        }
        setSavedNoteId(reportId);
        setTimeout(() => setSavedNoteId(null), 2000);
      };

      // KPI Calculations
      const totalStudentsCount = students.length;
      const gmailCount = students.filter(s => s.auth_method === 'google' || s.auth_method === 'gmail' || (s.email && s.email.includes('@gmail.com'))).length;
      const phoneCount = students.filter(s => s.auth_method === 'phone' || (s.contact_number && !s.email)).length;
      const emailWithPhoneCount = students.filter(s => s.auth_method === 'email_with_phone').length;

      const totalAttemptsCount = allAttempts.length;
      const ptmAttemptsCount = allAttempts.filter(a => (a.testCode && a.testCode.startsWith('PTM')) || (a.testId && a.testId.includes('ptm'))).length;
      const ptaAttemptsCount = allAttempts.filter(a => (a.testCode && a.testCode.startsWith('PTA')) || (a.testId && a.testId.includes('pta'))).length;

      const totalLecturesCount = allLectures.filter(l => l.completed).length;
      const totalBookmarksCount = allBookmarks.length;
      const liveTestsCount = Object.values(testConfigs).filter(s => s === 'live').length;
      const openReportsCount = reports.filter(r => r.status === 'open').length;

      // Filtered Students
      const filteredStudents = students.filter(s => {
        if (studentSearch) {
          const q = studentSearch.toLowerCase();
          const matchName = (s.name || '').toLowerCase().includes(q);
          const matchEmail = (s.email || '').toLowerCase().includes(q);
          const matchPhone = (s.contact_number || '').includes(q);
          if (!matchName && !matchEmail && !matchPhone) return false;
        }
        if (studentAuthFilter !== 'All') {
          if (studentAuthFilter === 'google' || studentAuthFilter === 'gmail') {
            if (s.auth_method !== 'google' && s.auth_method !== 'gmail' && !(s.email && s.email.includes('@gmail.com'))) return false;
          } else if (studentAuthFilter === 'phone') {
            if (s.auth_method !== 'phone' && !(s.contact_number && !s.email)) return false;
          } else if (studentAuthFilter === 'email_with_phone') {
            if (s.auth_method !== 'email_with_phone') return false;
          }
        }
        if (studentExamFilter !== 'All' && s.target_exam !== studentExamFilter) {
          return false;
        }
        return true;
      });

      // Filtered Attempts
      const filteredAttempts = allAttempts.filter(att => {
        if (attemptSearch) {
          const q = attemptSearch.toLowerCase();
          const matchUser = (att.userName || att.name || '').toLowerCase().includes(q);
          const matchTest = (att.testCode || att.testId || '').toLowerCase().includes(q);
          if (!matchUser && !matchTest) return false;
        }
        if (attemptExamFilter !== 'All') {
          const isMains = (att.testCode && att.testCode.startsWith('PTM')) || (att.testId && att.testId.includes('mains'));
          if (attemptExamFilter === 'JEE Mains' && !isMains) return false;
          if (attemptExamFilter === 'JEE Advanced' && isMains) return false;
        }
        if (attemptCodeFilter !== 'All') {
          if (att.testCode !== attemptCodeFilter && att.testId !== attemptCodeFilter) return false;
        }
        return true;
      });

      // Filtered Reports
      const filteredReports = reports.filter(r => reportFilter === 'All' || r.status === reportFilter);

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-[#0a0a0c] text-slate-900 dark:text-zinc-50 pb-20">
          {/* Header */}
          <div className="border-b border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#101116] sticky top-16 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl font-bold">
                  🛡️
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-black tracking-tight text-slate-900 dark:text-zinc-50">
                      Private Admin Dashboard
                    </h1>
                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800">
                      Master Control
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 dark:text-zinc-400">
                    Official JEE Test Series Engine · Mentored by <strong>Nelov Mallick (IIT Delhi)</strong>

                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                    Supabase Cloud Connected
                  </span>

                    <span className="w-2 h-2 rounded-full bg-amber-500" />
                    Local Storage Mode
                  </span>
                )}
                <button
                  type="button"
                  onClick={() => { setView('home'); window.location.hash = '#/'; }}
                  className="px-3.5 py-1.5 rounded-xl border border-slate-200 dark:border-zinc-800 text-slate-600 dark:text-zinc-300 font-bold hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors"

                { id: 'students', label: `All Students (${totalStudentsCount})`, icon: '👥', badge: totalStudentsCount },
                { id: 'attempts', label: `All Attempts (${totalAttemptsCount})`, icon: '📝' },
                { id: 'tests', label: 'Manage Tests (PTM & PTA)', icon: '⚙️' },
                { id: 'reports', label: `Error Reports (${openReportsCount})`, icon: '🚩', badge: openReportsCount },
              ].map((tab) => (
                <button

                  className={`flex items-center gap-2 px-4 py-2.5 rounded-t-xl text-xs sm:text-sm font-bold border-b-2 transition-all whitespace-nowrap ${
                    adminTab === tab.id
                      ? 'border-indigo-600 text-indigo-600 dark:text-indigo-400 bg-indigo-50/50 dark:bg-indigo-950/20'
                      : 'border-transparent text-slate-600 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-200 hover:bg-slate-100/50'
                  }`}
                >
                  <span>{tab.icon}</span>
                  <span>{tab.label}</span>
                  {tab.badge !== undefined && tab.badge > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-rose-500 text-white font-black">
                      {tab.badge}

                </button>

                    <p className="text-[10px] text-emerald-600 font-semibold truncate">
                      Gmail: {gmailCount} · Phone: {phoneCount}
                    </p>
                  </div>
                  <div className="rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#121318] p-5 shadow-sm space-y-2">

                    <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Test Submissions</p>
                    <h3 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-zinc-50">{totalAttemptsCount}</h3>
                    <p className="text-[10px] text-indigo-600 font-semibold truncate">
                      PTM: {ptmAttemptsCount} · PTA: {ptaAttemptsCount}
                    </p>
                  </div>
                  <div className="rounded-3xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-[#121318] p-5 shadow-sm space-y-2">
                    <span className="text-2xl">▶</span>
                    <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Lectures Done</p>
                    <h3 className="text-2xl sm:text-3xl font-black text-rose-600 dark:text-rose-400">{totalLecturesCount}</h3>
                    <p className="text-[10px] text-slate-500 font-semibold">Self-Paced Progress</p>

                    <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Live Active Tests</p>

    class CBTErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("CBT Engine ErrorBoundary caught an error:", error, errorInfo);
      }

      handleReset = () => {
        this.setState({ hasError: false, error: null });
        if (this.props.onReset) {
          this.props.onReset();
        } else {
          window.location.reload();
        }
      };

      handleReturnHome = () => {
        this.setState({ hasError: false, error: null });
        if (this.props.onReturnHome) {
          this.props.onReturnHome();
        } else {
          window.location.hash = '#/';
          window.location.reload();
        }
      };

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-50 dark:bg-[#0a0a0c] flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-white dark:bg-[#121318] border border-red-200 dark:border-red-900/60 rounded-3xl p-6 sm:p-8 shadow-2xl text-center space-y-5 animate-in fade-in">
                <div className="w-16 h-16 rounded-2xl bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 text-3xl flex items-center justify-center mx-auto shadow-inner">
                  ⚠️
                </div>
                <div className="space-y-2">
                  <h2 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-zinc-50">
                    CBT Test Engine Encountered an Issue
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-600 dark:text-zinc-400 leading-relaxed">
                    An unexpected render error occurred. Your candidate session is preserved in local storage.
                  </p>
                </div>
                {this.state.error && (
                  <div className="text-left bg-slate-100 dark:bg-zinc-900/80 p-3.5 rounded-xl border border-slate-200 dark:border-zinc-800 text-[11px] font-mono text-red-600 dark:text-red-400 overflow-x-auto max-h-36">
                    {this.state.error.message || String(this.state.error)}
                  </div>
                )}
                <div className="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3">
                  <button
                    type="button"
                    onClick={this.handleReset}
                    className="w-full sm:w-auto px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md transition-all hover:scale-105 active:scale-95"
                  >
                    ↺ Retry / Reload Test
                  </button>
                  <button
                    type="button"
                    onClick={this.handleReturnHome}
                    className="w-full sm:w-auto px-6 py-3 rounded-xl border border-slate-200 dark:border-zinc-700 hover:bg-slate-50 dark:hover:bg-zinc-800 text-slate-700 dark:text-zinc-300 font-bold text-xs transition-colors"
                  >
                    ← Return to Test Library
                  </button>
                </div>
                <p className="text-[11px] text-slate-400 dark:text-zinc-500">
                  NelovMallickIITD CBT Platform · 100% Free · Mentored by Nelov Mallick (IIT Delhi)
                </p>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }
